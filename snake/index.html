<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Snake - 4P Multiplayer</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
    width:100%; height:100%;
    overflow:hidden;
    touch-action: manipulation;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
}
body {
    background:#0D0D1A;
    font-family:monospace;
    display:flex; justify-content:center; align-items:center;
}
#app-container {
    display:flex; flex-direction:column;
    width:100%; max-width:600px;
    height:100vh; height:100dvh;
}
#game-container {
    position:relative; flex:0 0 auto;
    display:flex; justify-content:center; align-items:center;
    background:#0D0D1A;
}
#gameCanvas { display:block; background:#0D0D1A; }

.overlay {
    position:absolute; top:0; left:0;
    width:100%; height:100%;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    pointer-events:none; z-index:10;
}
.overlay > * { pointer-events:auto; }
.hidden { display:none !important; }
.hidden-ctrl { display:none !important; }

.menu-btn {
    background:#1A1A2E; color:#CCCCCC; border:1px solid #00FF88;
    padding:10px 16px; font-family:monospace; font-size:clamp(12px,3vw,16px);
    cursor:pointer; margin:4px; transition:all 0.15s;
    border-radius:6px; min-width:200px; max-width:88vw;
    -webkit-tap-highlight-color:transparent;
}
.menu-btn:hover { background:#00FF88; color:#0D0D1A; }
.menu-btn:active { transform:scale(0.97); background:#00FF88; color:#0D0D1A; }

.title-text {
    color:#00FF88; font-size:clamp(24px,8vw,42px); font-weight:bold;
    letter-spacing:clamp(6px,2vw,12px); margin-bottom:4px;
    text-shadow:0 0 20px rgba(0,255,136,0.4);
}
.subtitle { color:#8888AA; font-size:clamp(10px,2.5vw,14px); margin-bottom:20px; text-align:center; padding:0 10px; }
.hint-text { color:#8888AA; font-size:clamp(10px,2.2vw,12px); margin-top:10px; text-align:center; padding:0 10px; }

.connect-area {
    background:#1A1A2E; border:1px solid #44BBFF; border-radius:4px;
    padding:12px; width:min(500px,92vw); margin:6px 0;
}
.connect-area label { display:block; color:#CCCCCC; font-size:clamp(11px,2.2vw,13px); margin-bottom:4px; }
.connect-area textarea {
    width:100%; height:80px; background:#0D0D1A; color:#00FF88;
    border:1px solid #333; font-family:monospace; font-size:clamp(10px,2vw,12px);
    padding:6px; resize:vertical; outline:none; border-radius:2px;
}
.connect-area textarea:focus { border-color:#00FF88; }
.connect-area .btn-row { display:flex; gap:8px; margin-top:8px; justify-content:center; flex-wrap:wrap; }
.connect-area .a-btn {
    background:#16213E; color:#CCCCCC; border:1px solid #44BBFF;
    padding:8px 14px; font-family:monospace; font-size:clamp(11px,2.2vw,13px);
    cursor:pointer; border-radius:4px; transition:all 0.15s;
    -webkit-tap-highlight-color:transparent;
}
.connect-area .a-btn:hover { background:#44BBFF; color:#0D0D1A; }
.connect-area .a-btn:active { background:#44BBFF; color:#0D0D1A; }
.connect-area .status-text {
    color:#8888AA; font-size:clamp(10px,2vw,12px); margin-top:6px; text-align:center; min-height:16px;
}
.connected-dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle; }
.player-list { margin:4px 0; color:#CCCCCC; font-size:clamp(11px,2.2vw,13px); }
.player-list .p-entry { margin:2px 0; }
.lobby-info { color:#CCCCCC; font-size:clamp(12px,2.5vw,14px); text-align:center; margin:3px 0; }
.lobby-info .highlight { color:#00FF88; }
.status-msg {
    color:#FF4444; font-size:clamp(11px,2.2vw,13px); text-align:center; margin-top:4px; min-height:18px;
}
.code-ready-msg {
    color:#FFBB00; font-size:clamp(16px,4vw,24px); font-weight:bold; text-align:center;
    margin-bottom:8px; letter-spacing:2px;
    text-shadow:0 0 15px rgba(255,187,0,0.5);
    animation:codePulse 1.5s ease-in-out infinite;
}
@keyframes codePulse { 0%,100% { opacity:1; } 50% { opacity:0.6; } }

/* GAME OVER OVERLAY */
.gameover-title {
    color:#FF4444; font-size:clamp(28px,8vw,48px); font-weight:bold;
    letter-spacing:clamp(4px,2vw,10px); margin-bottom:12px;
    text-shadow:0 0 30px rgba(255,68,68,0.5);
}
.gameover-winner {
    color:#CCCCCC; font-size:clamp(16px,4vw,24px); font-weight:bold;
    letter-spacing:2px;
}

/* SCORE BAR */
#scorebar {
    flex:0 0 auto;
    background:#1A1A2E;
    border-top:1px solid #00FF88;
    border-bottom:1px solid #00FF88;
    padding:6px 8px;
    display:flex; flex-direction:column;
    justify-content:center;
    min-height:56px;
}
#score-player-list {
    display:flex; flex-wrap:wrap; justify-content:space-around; align-items:center;
    gap:6px;
}
.score-player-entry {
    display:flex; flex-direction:column; align-items:center;
    background:#0D0D1A; border-radius:6px;
    padding:4px 10px; min-width:70px;
}
.score-player-name {
    font-size:clamp(9px,2vw,11px); font-weight:bold;
    letter-spacing:1px;
}
.score-player-score {
    font-size:clamp(14px,3.5vw,20px); font-weight:bold;
}
.score-player-dead {
    font-size:clamp(8px,1.8vw,10px);
    color:#FF4444; font-weight:bold;
}
#score-hint {
    text-align:center; margin-top:2px;
    font-size:clamp(8px,1.8vw,10px); color:#8888AA;
    min-height:14px;
}

/* CONTROLLER */
#controller-area {
    flex:1; display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    min-height:180px;
    background:#0A0A16;
    border-top:2px solid #00FF88;
    padding:8px;
}
#dpad {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    gap:6px;
    width:min(210px,55vw);
    height:min(210px,55vw);
}
.dpad-btn {
    background:#1A1A2E; border:2px solid #00FF88; border-radius:14px;
    color:#00FF88; font-size:min(28px,7vw);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    transition:background 0.08s,transform 0.08s;
    -webkit-user-select:none; user-select:none;
}
.dpad-btn:active, .dpad-btn.pressed {
    background:#00FF88; color:#0D0D1A; transform:scale(0.92);
}
#btn-up    { grid-column:2; grid-row:1; }
#btn-left  { grid-column:1; grid-row:2; }
#btn-right { grid-column:3; grid-row:2; }
#btn-down  { grid-column:2; grid-row:3; }
#dpad-center { grid-column:2; grid-row:2; background:transparent; border:none; pointer-events:none; }

#action-row {
    display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; justify-content:center;
}
.action-btn {
    background:#1A1A2E; border:1px solid #44BBFF; color:#CCCCCC;
    padding:10px 16px; font-family:monospace; font-size:clamp(12px,3vw,14px);
    border-radius:8px; cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation; min-width:70px;
    transition:all 0.12s;
    -webkit-user-select:none; user-select:none;
}
.action-btn:active { background:#44BBFF; color:#0D0D1A; transform:scale(0.94); }
.hidden-btn { display:none !important; }
</style>
</head>
<body>
<div id="app-container">

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- MENU OVERLAY -->
        <div id="menu-overlay" class="overlay">
            <div class="title-text">SNAKE</div>
            <div class="subtitle">4 PLAYER MULTIPLAYER (port 8888)</div>
            <label style="color:#CCCCCC;font-size:clamp(11px,2.2vw,13px);margin:8px 0;cursor:pointer;display:flex;align-items:center;gap:8px;">
                <input type="checkbox" id="force-turn-checkbox" checked style="accent-color:#CC88FF;width:18px;height:18px;cursor:pointer;"> Always use TURN relay
            </label>
            <button class="menu-btn" onclick="createGame()">1 - CREATE GAME (HOST)</button>
            <button class="menu-btn" onclick="showJoinUI()">2 - JOIN GAME</button>
            <button class="menu-btn" onclick="showHelp()">3 - HOW TO PLAY</button>
            <div id="menu-status" class="status-msg"></div>
            <div class="hint-text">Use D-Pad / WASD / Arrows to move</div>
        </div>

        <!-- LOBBY OVERLAY -->
        <div id="lobby-overlay" class="overlay hidden">
            <div id="lobby-title" style="color:#00FF88;font-size:clamp(20px,5vw,28px);font-weight:bold;letter-spacing:4px;margin-bottom:4px;">LOBBY</div>
            <div class="lobby-info">Connected: <span id="player-count" class="highlight">0</span>/4</div>
            <div id="host-ip-info" style="color:#8888AA;font-size:clamp(10px,2vw,12px);margin-bottom:4px;"></div>
            <div id="player-list" class="player-list"></div>
            <div id="connect-panel" style="width:min(500px,92vw);margin:4px 0;">
                <div id="host-invite-row" style="text-align:center;margin:6px 0;">
                    <button class="a-btn" onclick="hostCopyInvite()" id="btn-invite">Copy Invite Link</button>
                </div>
                <div id="sdp-exchange" class="hidden connect-area" style="margin:0 auto;">
                    <div id="code-ready-banner" class="code-ready-msg hidden">✅ RESPONSE CODE GENERATED!</div>
                    <div id="sdp-step-label" style="color:#CCCCCC;font-size:clamp(11px,2.2vw,13px);margin-bottom:4px;"></div>
                    <textarea id="sdp-textarea" readonly></textarea>
                    <div class="btn-row">
                        <button class="a-btn" id="sdp-copy-btn" onclick="copySDP()">Copy Code</button>
                        <button class="a-btn" id="sdp-next-btn" style="display:none;">Next Step...</button>
                    </div>
                    <div id="sdp-status" class="status-text"></div>
                </div>
                <div id="sdp-receive" class="hidden connect-area" style="margin:0 auto;">
                    <label id="sdp-receive-label">Paste the code you received here:</label>
                    <textarea id="sdp-paste-area" placeholder="Paste the code here..."></textarea>
                    <div class="btn-row">
                        <button class="a-btn" onclick="submitPastedSDP()">Submit</button>
                        <button class="a-btn" onclick="cancelConnection()">Cancel</button>
                    </div>
                    <div id="sdp-receive-status" class="status-text"></div>
                </div>
            </div>
            <div id="lobby-wait-msg" style="color:#8888AA;font-size:clamp(11px,2.2vw,13px);margin:4px 0;"></div>
            <div id="ice-status" style="color:#8888AA;font-size:clamp(12px,2.5vw,14px);text-align:center;min-height:20px;margin:4px 0;padding:4px 8px;border-radius:4px;"></div>
            <div id="start-hint" class="hidden" style="color:#00FF88;font-size:clamp(12px,2.5vw,14px);margin:4px 0;">Tap START or press SPACE to begin!</div>
            <div class="hint-text">QUIT: Back to menu</div>
        </div>

        <!-- GAME OVER OVERLAY -->
        <div id="gameover-overlay" class="overlay hidden">
            <div class="gameover-title">GAME OVER</div>
            <div id="gameover-winner" class="gameover-winner"></div>
        </div>
    </div>

    <div id="conn-indicator" style="flex:0 0 auto;color:#8888AA;font-size:clamp(10px,2vw,12px);text-align:center;min-height:18px;padding:2px 8px;background:#0A0A16;border-top:1px solid #16213E;"></div>

    <!-- SCORE BAR -->
    <div id="scorebar" class="hidden-ctrl">
        <div id="score-player-list"></div>
        <div id="score-hint"></div>
    </div>

    <!-- CONTROLLER -->
    <div id="controller-area" class="hidden-ctrl">
        <div id="dpad">
            <button class="dpad-btn" id="btn-up"    data-dir="1">▲</button>
            <button class="dpad-btn" id="btn-left"  data-dir="3">◄</button>
            <div id="dpad-center"></div>
            <button class="dpad-btn" id="btn-right" data-dir="4">►</button>
            <button class="dpad-btn" id="btn-down"  data-dir="2">▼</button>
        </div>
        <div id="action-row">
            <button class="action-btn hidden-btn" id="btn-start-game">START</button>
            <button class="action-btn hidden-btn" id="btn-restart-game">RESTART</button>
            <button class="action-btn hidden-btn" id="btn-quit-game">QUIT</button>
        </div>
    </div>

</div>

<script>
// ============================================================
// CONSTANTS
// ============================================================
const GRID_W = 40, GRID_H = 20;
const MAX_PLAYERS = 4;
const TICK_RATE = 10.0;
const TARGET_FRAME = 1000 / 60;

// ============================================================
// DYNAMIC SIZING
// ============================================================
let CELL_SIZE = 20;
let BUFFER_W = GRID_W * CELL_SIZE;
let BUFFER_H = GRID_H * CELL_SIZE;
let WIN_W = BUFFER_W;
let WIN_H = BUFFER_H;
let CHAR_PX = 2;

// ============================================================
// COLORS
// ============================================================
const COLORS = {
    BG:'#1A1A2E',GRID:'#16213E',WALL:'#E94560',FOOD:'#FF4444',
    SCORE:'#CCCCCC',EYE:'#FFFFFF',OVERLAY:'rgba(0,0,0,0.53)',
    MENU_BG:'#0D0D1A',TITLE:'#00FF88',HINT:'#8888AA',RED:'#FF4444',
    PLAYER:['#00FF88','#44BBFF','#FFBB00','#FF66BB'],
    BODY:['#00CC66','#3399DD','#DD9900','#DD4499']
};

// ============================================================
// BITMAP GLYPHS (kept for any future canvas rendering needs)
// ============================================================
const DIGIT_GLYPHS = [
    [0b01110,0b10001,0b10001,0b10001,0b10001,0b10001,0b01110],
    [0b00100,0b01100,0b00100,0b00100,0b00100,0b00100,0b01110],
    [0b01110,0b10001,0b00001,0b00010,0b00100,0b01000,0b11111],
    [0b01110,0b10001,0b00001,0b00110,0b00001,0b10001,0b01110],
    [0b00010,0b00110,0b01010,0b10010,0b11111,0b00010,0b00010],
    [0b11111,0b10000,0b11110,0b00001,0b00001,0b10001,0b01110],
    [0b00110,0b01000,0b10000,0b11110,0b10001,0b10001,0b01110],
    [0b11111,0b00001,0b00010,0b00100,0b01000,0b01000,0b01000],
    [0b01110,0b10001,0b10001,0b01110,0b10001,0b10001,0b01110],
    [0b01110,0b10001,0b10001,0b01111,0b00001,0b00010,0b01100]
];
const LETTER_GLYPHS = [
    [0b01110,0b10001,0b10001,0b11111,0b10001,0b10001,0b10001],
    [0b11110,0b10001,0b10001,0b11110,0b10001,0b10001,0b11110],
    [0b01110,0b10001,0b10000,0b10000,0b10000,0b10001,0b01110],
    [0b11100,0b10010,0b10001,0b10001,0b10001,0b10010,0b11100],
    [0b11111,0b10000,0b10000,0b11110,0b10000,0b10000,0b11111],
    [0b11111,0b10000,0b10000,0b11110,0b10000,0b10000,0b10000],
    [0b01110,0b10001,0b10000,0b10111,0b10001,0b10001,0b01110],
    [0b10001,0b10001,0b10001,0b11111,0b10001,0b10001,0b10001],
    [0b01110,0b00100,0b00100,0b00100,0b00100,0b00100,0b01110],
    [0b00111,0b00010,0b00010,0b00010,0b00010,0b10010,0b01100],
    [0b10001,0b10010,0b10100,0b11000,0b10100,0b10010,0b10001],
    [0b10000,0b10000,0b10000,0b10000,0b10000,0b10000,0b11111],
    [0b10001,0b11011,0b10101,0b10101,0b10001,0b10001,0b10001],
    [0b10001,0b10001,0b11001,0b10101,0b10011,0b10001,0b10001],
    [0b01110,0b10001,0b10001,0b10001,0b10001,0b10001,0b01110],
    [0b11110,0b10001,0b10001,0b11110,0b10000,0b10000,0b10000],
    [0b01110,0b10001,0b10001,0b10001,0b10101,0b10010,0b01101],
    [0b11110,0b10001,0b10001,0b11110,0b10100,0b10010,0b10001],
    [0b01110,0b10001,0b10000,0b01110,0b00001,0b10001,0b01110],
    [0b11111,0b00100,0b00100,0b00100,0b00100,0b00100,0b00100],
    [0b10001,0b10001,0b10001,0b10001,0b10001,0b10001,0b01110],
    [0b10001,0b10001,0b10001,0b10001,0b10001,0b01010,0b00100],
    [0b10001,0b10001,0b10001,0b10101,0b10101,0b11011,0b10001],
    [0b10001,0b10001,0b01010,0b00100,0b01010,0b10001,0b10001],
    [0b10001,0b10001,0b01010,0b00100,0b00100,0b00100,0b00100],
    [0b11111,0b00001,0b00010,0b00100,0b01000,0b10000,0b11111]
];
const EXTRA_GLYPHS = [
    [0b00000,0b00100,0b00100,0b00000,0b00100,0b00100,0b00000],
    [0b00000,0b00000,0b00000,0b00000,0b00000,0b00000,0b00000]
];
const CHAR_W=5,CHAR_H=7;

// ============================================================
// ENUMS
// ============================================================
const Direction={STOP:0,UP:1,DOWN:2,LEFT:3,RIGHT:4};
const AppState={MENU:0,LOBBY:1,PLAYING:2};
const NetRole={NONE:0,HOST:1,CLIENT:2};
const PacketType={JOIN_ACCEPT:0,PLAYER_INPUT:1,GAME_STATE:2};

// ============================================================
// CANVAS SETUP
// ============================================================
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');

function resizeGame(){
    const pad=16;
    const maxW=window.innerWidth-pad;
    const maxH=window.innerHeight*(appState===AppState.PLAYING?0.65:0.55);
    let cs=Math.floor(maxW/GRID_W);
    cs=Math.max(8,cs);
    let totH=GRID_H*cs;
    if(totH>maxH){
        cs=Math.floor(maxH/GRID_H);
        cs=Math.max(8,cs);
    }
    CELL_SIZE=cs;
    BUFFER_W=GRID_W*CELL_SIZE;
    BUFFER_H=GRID_H*CELL_SIZE;
    WIN_W=BUFFER_W;
    WIN_H=BUFFER_H;
    CHAR_PX=Math.max(1,Math.round(CELL_SIZE/10));
    canvas.width=WIN_W;
    canvas.height=WIN_H;
    document.getElementById('game-container').style.height=WIN_H+'px';
}

// ============================================================
// GAME STATE
// ============================================================
let gameState={food:{x:0,y:0},gameOver:false,aliveCount:0,players:[]};
for(let i=0;i<MAX_PLAYERS;i++){
    gameState.players.push({body:[],dir:Direction.RIGHT,score:0,alive:false,active:false,nextDir:Direction.STOP});
}
let appState=AppState.MENU;
let netRole=NetRole.NONE;
let localPlayerId=-1;
let activePlayerCount=0;

// ============================================================
// WEBRTC STATE
// ============================================================
const STUN_CONFIG={'iceServers':[
    {'urls':'stun:stun.l.google.com:19302'},
    {'urls':'stun:stun1.l.google.com:19302'},
    {'urls':'stun:stun2.l.google.com:19302'},
    {'urls':'stun:stun3.l.google.com:19302'},
    {'urls':'stun:stun4.l.google.com:19302'},
    {'urls':'stun:stun.relay.metered.ca:80'},
    {'urls':'turn:global.relay.metered.ca:80','username':'b91725d7ea7bd065ec4541ce','credential':'mtiQ613jx/8DXIW0'},
    {'urls':'turn:global.relay.metered.ca:80?transport=tcp','username':'b91725d7ea7bd065ec4541ce','credential':'mtiQ613jx/8DXIW0'},
    {'urls':'turn:global.relay.metered.ca:443','username':'b91725d7ea7bd065ec4541ce','credential':'mtiQ613jx/8DXIW0'},
    {'urls':'turns:global.relay.metered.ca:443?transport=tcp','username':'b91725d7ea7bd065ec4541ce','credential':'mtiQ613jx/8DXIW0'}
]};
let forceTurnRelay=true;
function getIceConfig(){
    const cb=document.getElementById('force-turn-checkbox');
    if(cb)forceTurnRelay=cb.checked;
    return Object.assign({iceTransportPolicy:forceTurnRelay?'relay':'all'},STUN_CONFIG);
}
let hostPC=null,hostDC=null,clientPC=null,clientDC=null;
let clientChannels=[];
let sdpBuffer='';
let clientAnswerSDP=null;

// ============================================================
// DRAWING HELPERS
// ============================================================
function fillRect(x,y,w,h,hex){ctx.fillStyle=hex;ctx.fillRect(x,y,w,h);}
function drawCell(gx,gy,hex){const px=gx*CELL_SIZE,py=gy*CELL_SIZE;fillRect(px+1,py+1,CELL_SIZE-2,CELL_SIZE-2,hex);}

// ============================================================
// GAME LOGIC
// ============================================================
function genFood(){
    let ok;
    do{
        ok=true;
        gameState.food.x=1+Math.floor(Math.random()*(GRID_W-2));
        gameState.food.y=1+Math.floor(Math.random()*(GRID_H-2));
        for(let p=0;p<MAX_PLAYERS;p++){
            if(!gameState.players[p].active)continue;
            for(const seg of gameState.players[p].body){
                if(seg.x===gameState.food.x&&seg.y===gameState.food.y){ok=false;break;}
            }
            if(!ok)break;
        }
    }while(!ok);
}
function spawnPlayer(id){
    const p=gameState.players[id];
    p.body=[];p.score=0;p.alive=true;p.dir=Direction.RIGHT;p.nextDir=Direction.STOP;
    const spawns=[{x:Math.floor(GRID_W/4),y:Math.floor(GRID_H/2)},{x:Math.floor(3*GRID_W/4),y:Math.floor(GRID_H/2)},{x:Math.floor(GRID_W/2),y:Math.floor(GRID_H/4)},{x:Math.floor(GRID_W/2),y:Math.floor(3*GRID_H/4)}];
    const sx=spawns[id].x,sy=spawns[id].y;
    p.body.push({x:sx,y:sy},{x:sx-1,y:sy},{x:sx-2,y:sy});
}
function resetAll(){
    for(let i=0;i<MAX_PLAYERS;i++){
        if(gameState.players[i].active)spawnPlayer(i);
        else{gameState.players[i].body=[];gameState.players[i].alive=false;}
    }
    gameState.gameOver=false;genFood();
    gameState.aliveCount=0;
    for(const p of gameState.players)if(p.alive)gameState.aliveCount++;
}
function startMatch(){
    resetAll();gameState.aliveCount=0;
    for(const p of gameState.players)if(p.active)gameState.aliveCount++;
    appState=AppState.PLAYING;hideAllOverlays();
    document.getElementById('scorebar').classList.remove('hidden-ctrl');
    document.getElementById('gameover-overlay').classList.add('hidden');
    updateControllerUI();
}
function hostPrepare(){
    for(let i=0;i<MAX_PLAYERS;i++)
        gameState.players[i]={body:[],dir:Direction.RIGHT,score:0,alive:false,active:false,nextDir:Direction.STOP};
    gameState.players[0].active=true;activePlayerCount=1;localPlayerId=0;
    spawnPlayer(0);genFood();appState=AppState.LOBBY;
}
function updatePlayer(id){
    const p=gameState.players[id];
    if(!p.alive||p.body.length===0)return;
    let md=p.dir;
    if(p.nextDir!==Direction.STOP){
        const opp=(p.dir===Direction.UP&&p.nextDir===Direction.DOWN)||
                 (p.dir===Direction.DOWN&&p.nextDir===Direction.UP)||
                 (p.dir===Direction.LEFT&&p.nextDir===Direction.RIGHT)||
                 (p.dir===Direction.RIGHT&&p.nextDir===Direction.LEFT);
        if(!opp)md=p.nextDir;
        p.dir=md;p.nextDir=Direction.STOP;
    }
    const nh={x:p.body[0].x,y:p.body[0].y};
    switch(md){
        case Direction.UP:nh.y--;break;
        case Direction.DOWN:nh.y++;break;
        case Direction.LEFT:nh.x--;break;
        case Direction.RIGHT:nh.x++;break;
        default:return;
    }
    if(nh.x<=0||nh.x>=GRID_W-1||nh.y<=0||nh.y>=GRID_H-1){p.alive=false;gameState.aliveCount--;return;}
    const ate=(nh.x===gameState.food.x&&nh.y===gameState.food.y);
    p.body.unshift({x:nh.x,y:nh.y});
    if(ate){p.score+=10;genFood();}else p.body.pop();
    for(let i=1;i<p.body.length;i++){
        if(p.body[0].x===p.body[i].x&&p.body[0].y===p.body[i].y){p.alive=false;gameState.aliveCount--;return;}
    }
    for(let o=0;o<MAX_PLAYERS;o++){
        if(o===id||!gameState.players[o].alive)continue;
        for(const seg of gameState.players[o].body){
            if(p.body[0].x===seg.x&&p.body[0].y===seg.y){p.alive=false;gameState.aliveCount--;return;}
        }
    }
}
function tick(){
    if(netRole!==NetRole.HOST||appState!==AppState.PLAYING)return;
    for(let i=0;i<MAX_PLAYERS;i++)if(gameState.players[i].alive)updatePlayer(i);
    let alive=0;for(const p of gameState.players)if(p.alive)alive++;
    if(alive===0&&!gameState.gameOver)gameState.gameOver=true;
    sendGameState();
}

// NETWORKING
// ============================================================
function sendPkt(dc,type,data){
    if(!dc||dc.readyState!=='open')return false;
    const len=1+(data?data.byteLength:0);
    const buf=new ArrayBuffer(len);
    const v=new Uint8Array(buf);
    v[0]=type;
    if(data)v.set(new Uint8Array(data),1);
    dc.send(buf);
    return true;
}
function sendGameState(){
    let size=4;
    for(let i=0;i<MAX_PLAYERS;i++){size+=5;size+=gameState.players[i].body.length*2;}
    const buf=new ArrayBuffer(size);
    const v=new Uint8Array(buf);
    let o=0;
    v[o++]=gameState.food.x;v[o++]=gameState.food.y;
    v[o++]=gameState.gameOver?1:0;v[o++]=gameState.aliveCount;
    for(let i=0;i<MAX_PLAYERS;i++){
        const p=gameState.players[i];
        v[o++]=p.active?1:0;v[o++]=p.alive?1:0;v[o++]=p.score;v[o++]=p.dir;v[o++]=p.body.length;
        for(const seg of p.body){v[o++]=seg.x;v[o++]=seg.y;}
    }
    for(let i=0;i<clientChannels.length;i++){
        if(clientChannels[i]&&clientChannels[i].readyState==='open')sendPkt(clientChannels[i],PacketType.GAME_STATE,buf);
    }
}
function parseGameState(data){
    const v=new Uint8Array(data);
    let o=0;
    gameState.food={x:v[o++],y:v[o++]};
    gameState.gameOver=v[o++]!==0;gameState.aliveCount=v[o++];
    for(let i=0;i<MAX_PLAYERS;i++){
        const p=gameState.players[i];
        if(o>=v.length)break;
        p.active=v[o++]!==0;p.alive=v[o++]!==0;p.score=v[o++];p.dir=v[o++];
        const bl=v[o++];p.body=[];
        for(let b=0;b<bl;b++){if(o+1>=v.length)break;p.body.push({x:v[o++],y:v[o++]});}
    }
}
function encodeSDP(sdp){
    const enc=new TextEncoder();
    const bytes=enc.encode(sdp);
    let binary='';
    for(let i=0;i<bytes.length;i++)binary+=String.fromCharCode(bytes[i]);
    return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodeSDP(encoded){
    let base64=encoded.replace(/-/g,'+').replace(/_/g,'/');
    while(base64.length%4)base64+='=';
    const binary=atob(base64);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    const dec=new TextDecoder();
    return dec.decode(bytes);
}
function setupHostDataChannel(dc){
    dc.onopen=()=>{
        const slot=clientChannels.length;
        const playerId=slot+1;
        clientChannels.push(dc);
        gameState.players[playerId].active=true;
        activePlayerCount++;
        if(appState===AppState.LOBBY)spawnPlayer(playerId);
        const buf=new ArrayBuffer(1);
        const v=new Uint8Array(buf);
        v[0]=playerId;
        sendPkt(dc,PacketType.JOIN_ACCEPT,buf);
        updateLobbyUI();
        setConnectionStatus('Player '+(playerId+1)+' connected!');
        resetInviteUI();
    };
    dc.onmessage=(e)=>{
        const v=new Uint8Array(e.data);
        if(v.length<1)return;
        const type=v[0];const data=v.slice(1);
        if(type===PacketType.PLAYER_INPUT&&data.length>=1){
            const dir=data[0];
            const idx=clientChannels.indexOf(dc);
            if(idx>=0){
                const pid=idx+1;
                const p=gameState.players[pid];
                if(p&&p.alive){
                    let lq=p.nextDir;
                    if(lq===Direction.STOP)lq=p.dir;
                    const opp=(lq===Direction.UP&&dir===Direction.DOWN)||
                             (lq===Direction.DOWN&&dir===Direction.UP)||
                             (lq===Direction.LEFT&&dir===Direction.RIGHT)||
                             (lq===Direction.RIGHT&&dir===Direction.LEFT);
                    if(!opp)p.nextDir=dir;
                }
            }
        }
    };
    dc.onclose=()=>{
        const idx=clientChannels.indexOf(dc);
        if(idx>=0){
            clientChannels.splice(idx,1);
            const pid=idx+1;
            gameState.players[pid].active=false;
            gameState.players[pid].alive=false;
            gameState.players[pid].body=[];
            activePlayerCount--;
            updateLobbyUI();
        }
    };
    if(dc.readyState==='open')setTimeout(()=>dc.onopen(),0);
}
function onClientMessage(e){
    const v=new Uint8Array(e.data);
    if(v.length<1)return;
    const type=v[0];const data=v.slice(1);
    if(type===PacketType.JOIN_ACCEPT&&data.length>=1){
        localPlayerId=data[0];
        setStatusMsg('You are P'+(localPlayerId+1),300);
        updateLobbyUI();
    }else if(type===PacketType.GAME_STATE&&data.length>=4){
        parseGameState(data);
        if(appState!==AppState.PLAYING){
            appState=AppState.PLAYING;
            hideAllOverlays();
            document.getElementById('scorebar').classList.remove('hidden-ctrl');
            document.getElementById('gameover-overlay').classList.add('hidden');
            updateControllerUI();
        }
    }
}
async function hostCreateOffer(){
    if(hostPC&&hostPC.iceConnectionState!=='closed'&&hostPC.iceConnectionState!=='failed'){
        console.warn('hostCreateOffer: Overwriting existing pending hostPC');
    }
    const pc=new RTCPeerConnection(getIceConfig());
    const dc=pc.createDataChannel('game');
    hostPC=pc;hostDC=dc;
    pc.oniceconnectionstatechange=()=>{
        console.log('HOST ICE state:',pc.iceConnectionState);
        switch(pc.iceConnectionState){
            case 'new':case 'checking':setIceStatus('\u{1F7E1} Checking connection...','#FFBB00');break;
            case 'connected':setIceStatus('\u{1F7E2} ICE Connected!','#00FF88');setTimeout(()=>detectTurnRelay(pc),500);break;
            case 'failed':setIceStatus('\u{1F534} ICE Failed (retrying...)','#FF4444');setConnectionStatus('ICE connection failed.');break;
            case 'disconnected':setIceStatus('\u{1F7E0} Disconnected - trying to reconnect...','#FFBB00');break;
            case 'closed':setIceStatus('\u{26AA} Connection closed','#8888AA');break;
        }
    };
    pc.onicecandidateerror=(e)=>{
        console.warn('HOST ICE candidate error:',e);
    };
    setupHostDataChannel(dc);
    const sdp=await new Promise((resolve,reject)=>{
        let gatheringDone=false;
        pc.onicegatheringstatechange=()=>{
            console.log('HOST ICE gathering:',pc.iceGatheringState);
            if(pc.iceGatheringState==='gathering'){
                setIceStatus('\u{1F50D} Gathering network candidates...','#FFBB00');
            }
            if(pc.iceGatheringState==='complete'&&!gatheringDone){
                gatheringDone=true;
                setIceStatus('\u{2705} Candidates gathered, code ready','#00FF88');
                resolve(pc.localDescription.sdp);
            }
        };
        pc.createOffer().then(offer=>pc.setLocalDescription(offer)).catch(err=>reject(err));
        setTimeout(()=>{if(!gatheringDone){gatheringDone=true;console.warn('HOST ICE gathering timed out after 15s');resolve(pc.localDescription.sdp);}},15000);
    });
    return sdp;
}
async function clientJoin(offerSdp){
    const pc=new RTCPeerConnection(getIceConfig());
    pc.ondatachannel=(event)=>{
        clientDC=event.channel;
        clientDC.onopen=()=>{netRole=NetRole.CLIENT;setConnectionStatus('Connected to host!');updateLobbyUI();updateControllerUI();};
        clientDC.onmessage=onClientMessage;
        clientDC.onclose=()=>{setStatusMsg('Disconnected from host',300);cleanupClient();appState=AppState.MENU;showMenu();updateControllerUI();};
        if(clientDC.readyState==='open'){netRole=NetRole.CLIENT;setConnectionStatus('Connected to host!');updateLobbyUI();updateControllerUI();}
    };
    pc.oniceconnectionstatechange=()=>{
        console.log('CLIENT ICE state:',pc.iceConnectionState);
        switch(pc.iceConnectionState){
            case 'new':case 'checking':setIceStatus('\u{1F7E1} Checking connection...','#FFBB00');break;
            case 'connected':setIceStatus('\u{1F7E2} ICE Connected!','#00FF88');setTimeout(()=>detectTurnRelay(pc),500);break;
            case 'failed':setIceStatus('\u{1F534} ICE Failed - may need TURN server','#FF4444');setConnectionStatus('ICE connection failed.');break;
            case 'disconnected':setIceStatus('\u{1F7E0} Disconnected - trying to reconnect...','#FFBB00');break;
            case 'closed':setIceStatus('\u{26AA} Connection closed','#8888AA');break;
        }
    };
    pc.onicecandidateerror=(e)=>{
        console.warn('CLIENT ICE candidate error:',e);
    };
    const sdp=await new Promise((resolve,reject)=>{
        let gatheringDone=false;
        pc.onicegatheringstatechange=()=>{
            console.log('CLIENT ICE gathering:',pc.iceGatheringState);
            if(pc.iceGatheringState==='gathering'){
                setIceStatus('\u{1F50D} Gathering network candidates...','#FFBB00');
            }
            if(pc.iceGatheringState==='complete'&&!gatheringDone){
                gatheringDone=true;
                setIceStatus('\u{2705} Candidates gathered, code ready','#00FF88');
                resolve(pc.localDescription.sdp);
            }
        };
        pc.setRemoteDescription({type:'offer',sdp:offerSdp})
          .then(()=>pc.createAnswer())
          .then(answer=>pc.setLocalDescription(answer))
          .catch(err=>reject(err));
        setTimeout(()=>{if(!gatheringDone){gatheringDone=true;console.warn('CLIENT ICE gathering timed out after 15s');resolve(pc.localDescription.sdp);}},15000);
    });
    clientAnswerSDP=sdp;
    return {pc,sdp};
}
function cleanupHost(){
    for(const dc of clientChannels){try{dc.close();}catch(e){}}
    clientChannels=[];
    if(hostPC){try{hostPC.close();}catch(e){}}hostPC=null;hostDC=null;netRole=NetRole.NONE;
    activePlayerCount=0;localPlayerId=-1;
    clearIceStatus();
}
function cleanupClient(){
    if(clientDC){try{clientDC.close();}catch(e){}clientDC=null;}
    if(clientPC){try{clientPC.close();}catch(e){}clientPC=null;}
    netRole=NetRole.NONE;localPlayerId=-1;
    clearIceStatus();
}
function cleanupAll(){cleanupHost();cleanupClient();}

let statusMsgTimeout=null;
function setStatusMsg(msg,duration){
    const el=document.getElementById('menu-status');
    if(el){
        el.textContent=msg;
        el.style.color=msg.toLowerCase().includes('fail')?'#FF4444':'#CCCCCC';
        if(statusMsgTimeout)clearTimeout(statusMsgTimeout);
        if(duration)statusMsgTimeout=setTimeout(()=>{if(el)el.textContent='';},duration*1000/60);
    }
}
function setConnectionStatus(msg){
    const el1=document.getElementById('sdp-status');
    const el2=document.getElementById('sdp-receive-status');
    if(el1)el1.textContent=msg;
    if(el2)el2.textContent=msg;
}
function setIceStatus(msg,color){
    const elLobby=document.getElementById('ice-status');
    const elGlobal=document.getElementById('conn-indicator');
    if(elLobby){elLobby.textContent=msg;elLobby.style.color=color||'#8888AA';elLobby.style.background=color?(color==='#FF4444'?'rgba(255,68,68,0.1)':color==='#00FF88'?'rgba(0,255,136,0.08)':color==='#FFBB00'?'rgba(255,187,0,0.08)':'transparent'):'transparent';}
    if(elGlobal){elGlobal.textContent=msg;elGlobal.style.color=color||'#8888AA';elGlobal.style.background='transparent';}
}
function clearIceStatus(){
    const elLobby=document.getElementById('ice-status');
    const elGlobal=document.getElementById('conn-indicator');
    if(elLobby){elLobby.textContent='';elLobby.style.color='';elLobby.style.background='';}
    if(elGlobal){elGlobal.textContent='';elGlobal.style.color='';}
}
async function detectTurnRelay(pc){
    if(!pc||pc.iceConnectionState!=='connected')return;
    try{
        const stats=await pc.getStats();
        let isRelay=false;
        stats.forEach(r=>{
            if(r.type==='candidate-pair'&&r.state==='succeeded'&&r.nominated){
                const local=stats.get(r.localCandidateId);
                if(local&&(local.candidateType==='relay'||local.relayProtocol))isRelay=true;
            }
        });
        if(forceTurnRelay)setIceStatus('\u{1F7E3} Connected (TURN relay - forced)','#CC88FF');
        else if(isRelay)setIceStatus('\u{1F7E3} Connected (TURN relay)','#CC88FF');
        else setIceStatus('\u{1F7E2} Connected (Direct)','#00FF88');
    }catch(e){/*stats not available yet*/}
}

function updateControllerUI(){
    const ctrl=document.getElementById('controller-area');
    const btnStart=document.getElementById('btn-start-game');
    const btnRestart=document.getElementById('btn-restart-game');
    const btnQuit=document.getElementById('btn-quit-game');

    if(appState===AppState.MENU){
        ctrl.classList.add('hidden-ctrl');
        return;
    }
    ctrl.classList.remove('hidden-ctrl');

    if(appState===AppState.LOBBY){
        if(netRole===NetRole.HOST&&activePlayerCount>=1&&document.getElementById('host-invite-row').style.display!=='none'){
            btnStart.classList.remove('hidden-btn');
        }else{
            btnStart.classList.add('hidden-btn');
        }
        btnRestart.classList.add('hidden-btn');
        btnQuit.classList.remove('hidden-btn');
    }else if(appState===AppState.PLAYING){
        btnStart.classList.add('hidden-btn');
        if(gameState.gameOver&&netRole===NetRole.HOST){
            btnRestart.classList.remove('hidden-btn');
        }else{
            btnRestart.classList.add('hidden-btn');
        }
        btnQuit.classList.remove('hidden-btn');
    }
}

function onActionStart(){
    if(appState===AppState.LOBBY&&netRole===NetRole.HOST&&activePlayerCount>=1){
        startMatch();sendGameState();
        updateControllerUI();
    }
}
function onActionRestart(){
    if(appState===AppState.PLAYING&&gameState.gameOver&&netRole===NetRole.HOST){
        resetAll();sendGameState();
        updateControllerUI();
    }
}
function onActionQuit(){
    if(appState===AppState.LOBBY){
        if(netRole===NetRole.CLIENT)cancelJoin();
        else{cleanupHost();showMenu();}
    }else if(appState===AppState.PLAYING){
        cleanupAll();appState=AppState.MENU;showMenu();
    }
    updateControllerUI();
}

let hostConnectionTimer=null;
async function submitPastedSDP(){
    const pasted=document.getElementById('sdp-paste-area').value.trim();
    if(!pasted){setConnectionStatus('Please paste a valid code.');return;}
    setConnectionStatus('Connecting...');
    try{
        const sdp=decodeSDP(pasted);
        if(!hostPC){setConnectionStatus('No pending connection. Please generate a new invite.');return;}
        await hostPC.setRemoteDescription({type:'answer',sdp:sdp});
        setConnectionStatus('Establishing connection...');
        if(hostConnectionTimer)clearTimeout(hostConnectionTimer);
        hostConnectionTimer=setTimeout(()=>{
            if(appState===AppState.LOBBY&&netRole===NetRole.HOST&&(!hostDC||hostDC.readyState!=='open')){
                setConnectionStatus('Connection timed out (30s). The friend may be behind a strict firewall. Try again or consider using a VPN.');
                console.error('Host connection timed out - data channel never opened');
            }
        },30000);
    }catch(e){
        console.error('Failed to connect:',e);
        setConnectionStatus('Connection failed. The code might be invalid. Try again.');
    }
}

    document.getElementById('lobby-wait-msg').textContent='';
    document.getElementById('sdp-exchange').classList.add('hidden');
    document.getElementById('code-ready-banner').classList.add('hidden');
    document.getElementById('sdp-receive').classList.remove('hidden');
    document.getElementById('sdp-receive-label').textContent='Paste the invite code from the host here:';
    document.getElementById('sdp-paste-area').value='';
    document.getElementById('sdp-paste-area').placeholder='Paste the invite code...';
    document.getElementById('sdp-receive-status').textContent='';
    clearIceStatus();
    const submitBtn=document.querySelector('#sdp-receive .btn-row button:first-child');
    submitBtn.textContent='Join Game';
    submitBtn.onclick=clientSubmitOffer;
    const cancelBtn=document.querySelector('#sdp-receive .btn-row button:last-child');
    cancelBtn.onclick=cancelJoin;
    appState=AppState.LOBBY;netRole=NetRole.NONE;
    updateLobbyUI();
    updateControllerUI();
}
async function clientSubmitOffer(){
    const pasted=document.getElementById('sdp-paste-area').value.trim();
    if(!pasted){setConnectionStatus('Please paste the invite code from the host.');return;}
    setConnectionStatus('Connecting to host...');
    try{
        const sdp=decodeSDP(pasted);
        const result=await clientJoin(sdp);
        clientPC=result.pc;
        clientAnswerSDP=result.sdp;
        const encoded=encodeSDP(clientAnswerSDP);
        sdpBuffer=encoded;
        document.getElementById('sdp-receive').classList.add('hidden');
        document.getElementById('sdp-exchange').classList.remove('hidden');
        document.getElementById('code-ready-banner').classList.remove('hidden');
        document.getElementById('sdp-step-label').textContent='Send this response code back to the host:';
        document.getElementById('sdp-textarea').value=encoded;
        document.getElementById('sdp-textarea').readOnly=true;
        document.getElementById('sdp-copy-btn').style.display='inline-block';
        document.getElementById('sdp-copy-btn').textContent='Copy Code';
        document.getElementById('sdp-next-btn').style.display='none';
        setConnectionStatus('Waiting for host to apply the response...');
        updateControllerUI();
    }catch(e){
        console.error('Failed to join:',e);
        setConnectionStatus('Connection failed. Check the code and try again.');
    }
}
function cancelJoin(){
    cleanupClient();
    document.getElementById('lobby-overlay').classList.add('hidden');
    document.getElementById('menu-overlay').classList.remove('hidden');
    document.getElementById('controller-area').classList.add('hidden-ctrl');
    document.getElementById('scorebar').classList.add('hidden-ctrl');
    appState=AppState.MENU;
}
function showHelp(){setStatusMsg('Last snake alive wins! Eat food (+10) to grow. Use D-Pad/WASD/Arrows to move.',300);}

// ============================================================
// UPDATE LOBBY UI
// ============================================================
function updateLobbyUI(){
    document.getElementById('player-count').textContent=activePlayerCount;
    const listEl=document.getElementById('player-list');
    let html='';
    for(let i=0;i<MAX_PLAYERS;i++){
        if(gameState.players[i].active){
            const color=COLORS.PLAYER[i];
            const you=(i===localPlayerId)?' (YOU)':'';
            html+='<div class="p-entry"><span class="connected-dot" style="background:'+color+'"></span>Player '+(i+1)+you+'</div>';
        }
    }
    listEl.innerHTML=html;
    const startHint=document.getElementById('start-hint');
    if(netRole===NetRole.HOST&&activePlayerCount>=1){
        const inviteRow=document.getElementById('host-invite-row');
        startHint.classList.toggle('hidden',inviteRow.style.display==='none');
    }else{startHint.classList.add('hidden');}
    if(netRole===NetRole.HOST){
        document.getElementById('lobby-title').textContent='LOBBY (HOST)';
        document.getElementById('lobby-wait-msg').textContent='Tap START or press SPACE to begin!';
    }else if(netRole===NetRole.CLIENT){
        document.getElementById('lobby-title').textContent='LOBBY';
        document.getElementById('lobby-wait-msg').textContent='Waiting for host to start...';
    }else{
        document.getElementById('lobby-title').textContent='LOBBY';
        document.getElementById('lobby-wait-msg').textContent='Paste the invite code to join.';
    }
}

// ============================================================
// IN-GAME HTML UI UPDATES (replaces canvas text rendering)
// ============================================================
function updateScoreBar(){
    if(appState!==AppState.PLAYING)return;
    const listEl=document.getElementById('score-player-list');
    let html='';
    for(let i=0;i<MAX_PLAYERS;i++){
        if(!gameState.players[i].active)continue;
        const color=COLORS.PLAYER[i];
        const you=(i===localPlayerId)?' (YOU)':'';
        html+='<div class="score-player-entry">';
        html+='<span class="score-player-name" style="color:'+color+'">P'+(i+1)+you+'</span>';
        html+='<span class="score-player-score" style="color:'+color+'">'+gameState.players[i].score+'</span>';
        if(!gameState.players[i].alive&&!gameState.gameOver){
            html+='<span class="score-player-dead">DEAD</span>';
        }
        html+='</div>';
    }
    listEl.innerHTML=html;

    const hintEl=document.getElementById('score-hint');
    if(gameState.gameOver){
        if(netRole===NetRole.HOST){
            hintEl.textContent='RESTART: R key / Tap button';
        }else{
            hintEl.textContent='Waiting for host to restart...';
        }
    }else{
        hintEl.textContent='D-Pad: Move  |  Quit: Back / X key';
    }
}

function updateGameOverOverlay(){
    const overlay=document.getElementById('gameover-overlay');
    if(appState===AppState.PLAYING&&gameState.gameOver){
        overlay.classList.remove('hidden');
        let wid=-1,ms=-1;
        for(let i=0;i<MAX_PLAYERS;i++){
            if(gameState.players[i].active&&gameState.players[i].alive){wid=i;break;}
            if(gameState.players[i].active&&gameState.players[i].score>ms){ms=gameState.players[i].score;wid=i;}
        }
        const winnerEl=document.getElementById('gameover-winner');
        if(wid>=0){
            winnerEl.textContent='Player '+(wid+1)+' Wins!';
            winnerEl.style.color=COLORS.PLAYER[wid];
        }else{
            winnerEl.textContent='Draw!';
            winnerEl.style.color='#CCCCCC';
        }
    }else{
        overlay.classList.add('hidden');
    }
}

// ============================================================
// RENDERING
// ============================================================
function renderMenu(){fillRect(0,0,WIN_W,WIN_H,'#0D0D1A');}
function renderLobby(){fillRect(0,0,WIN_W,WIN_H,'#0D0D1A');}
function renderGame(){
    fillRect(0,0,BUFFER_W,BUFFER_H,'#1A1A2E');
    ctx.fillStyle='#16213E';
    for(let gx=0;gx<GRID_W;gx++)
        for(let gy=0;gy<GRID_H;gy++)
            ctx.fillRect(gx*CELL_SIZE,gy*CELL_SIZE,1,1);
    for(let gx=0;gx<GRID_W;gx++){drawCell(gx,0,'#E94560');drawCell(gx,GRID_H-1,'#E94560');}
    for(let gy=0;gy<GRID_H;gy++){drawCell(0,gy,'#E94560');drawCell(GRID_W-1,gy,'#E94560');}
    drawCell(gameState.food.x,gameState.food.y,'#FF4444');
    for(let p=0;p<MAX_PLAYERS;p++){
        const pl=gameState.players[p];
        if(!pl.active||pl.body.length===0)continue;
        for(let i=0;i<pl.body.length;i++){
            const seg=pl.body[i];
            if(i===0){
                const px=seg.x*CELL_SIZE,py=seg.y*CELL_SIZE;
                fillRect(px,py,CELL_SIZE,CELL_SIZE,COLORS.PLAYER[p]);
                ctx.fillStyle='#FFFFFF';
                const eyeOff=Math.max(2,Math.round(CELL_SIZE*0.35));
                const eyeSize=Math.max(1,Math.round(CELL_SIZE*0.1));
                ctx.fillRect(px+eyeOff,py+eyeOff,eyeSize,eyeSize);
                ctx.fillRect(px+CELL_SIZE-eyeOff-eyeSize,py+eyeOff,eyeSize,eyeSize);
            }else drawCell(seg.x,seg.y,COLORS.BODY[p]);
        }
    }
}
function renderDispatch(){
    ctx.clearRect(0,0,WIN_W,WIN_H);
    switch(appState){
        case AppState.MENU:renderMenu();break;
        case AppState.LOBBY:renderLobby();break;
        case AppState.PLAYING:renderGame();updateScoreBar();updateGameOverOverlay();break;
    }
}

// ============================================================
// INPUT: KEYBOARD (desktop fallback)
// ============================================================
document.addEventListener('keydown',(e)=>{
    if(e.repeat)return;
    if(appState===AppState.MENU){
        switch(e.key){
            case '1':if(!document.getElementById('menu-overlay').classList.contains('hidden'))createGame();break;
            case '2':if(!document.getElementById('menu-overlay').classList.contains('hidden'))showJoinUI();break;
            case '3':if(!document.getElementById('menu-overlay').classList.contains('hidden'))showHelp();break;
            case 'x':case 'Escape':window.close();break;
        }
        return;
    }
    if(appState===AppState.LOBBY){
        if(e.key===' '||e.key==='Space'){e.preventDefault();onActionStart();}
        if(e.key==='x'||e.key==='Escape'){onActionQuit();}
        return;
    }
    if(appState===AppState.PLAYING){
        if(e.key==='x'||e.key==='Escape'){onActionQuit();return;}
        if(e.key==='r'||e.key==='R'){onActionRestart();return;}
    }
});

const keys={};
document.addEventListener('keydown',(e)=>{if(!e.repeat)keys[e.key]=true;});
document.addEventListener('keyup',(e)=>{keys[e.key]=false;});

function processInput(){
    if(appState!==AppState.PLAYING||gameState.gameOver)return;
    let nd=Direction.STOP;
    if(keys['ArrowUp']||keys['w']||keys['W'])nd=Direction.UP;
    else if(keys['ArrowDown']||keys['s']||keys['S'])nd=Direction.DOWN;
    else if(keys['ArrowLeft']||keys['a']||keys['A'])nd=Direction.LEFT;
    else if(keys['ArrowRight']||keys['d']||keys['D'])nd=Direction.RIGHT;
    // Touch direction (set by dpad)
    if(touchDir!==Direction.STOP)nd=touchDir;
    if(nd!==Direction.STOP){
        if(netRole===NetRole.HOST&&localPlayerId>=0){
            const p=gameState.players[localPlayerId];
            let lq=p.nextDir;if(lq===Direction.STOP)lq=p.dir;
            const opp=(lq===Direction.UP&&nd===Direction.DOWN)||
                      (lq===Direction.DOWN&&nd===Direction.UP)||
                      (lq===Direction.LEFT&&nd===Direction.RIGHT)||
                      (lq===Direction.RIGHT&&nd===Direction.LEFT);
            if(!opp)p.nextDir=nd;
        }else if(netRole===NetRole.CLIENT&&clientDC&&clientDC.readyState==='open'){
            const buf=new ArrayBuffer(1);
            const v=new Uint8Array(buf);
            v[0]=nd;
            sendPkt(clientDC,PacketType.PLAYER_INPUT,buf);
        }
    }
}

// ============================================================
// INPUT: TOUCH D-PAD
// ============================================================
let touchDir=Direction.STOP;
const dpadBtns=document.querySelectorAll('.dpad-btn');

function setTouchDir(dir){
    touchDir=dir;
    // Highlight the active dpad button
    dpadBtns.forEach(b=>{
        if(parseInt(b.dataset.dir)===dir)b.classList.add('pressed');
        else b.classList.remove('pressed');
    });
}
function clearTouchDir(){
    touchDir=Direction.STOP;
    dpadBtns.forEach(b=>b.classList.remove('pressed'));
}

dpadBtns.forEach(btn=>{
    const dir=parseInt(btn.dataset.dir);
    // Touch events
    btn.addEventListener('touchstart',(e)=>{
        e.preventDefault();
        setTouchDir(dir);
    },{passive:false});
    btn.addEventListener('touchend',(e)=>{
        e.preventDefault();
        clearTouchDir();
    },{passive:false});
    btn.addEventListener('touchcancel',(e)=>{
        clearTouchDir();
    });
    // Mouse events (for desktop testing of dpad)
    btn.addEventListener('mousedown',(e)=>{
        e.preventDefault();
        setTouchDir(dir);
    });
    btn.addEventListener('mouseup',(e)=>{
        e.preventDefault();
        clearTouchDir();
    });
    btn.addEventListener('mouseleave',(e)=>{
        clearTouchDir();
    });
});

// Prevent scrolling when using the controller area
document.getElementById('controller-area').addEventListener('touchmove',(e)=>{
    e.preventDefault();
},{passive:false});

// ============================================================
// ACTION BUTTON WIRING
// ============================================================
document.getElementById('btn-start-game').addEventListener('click',onActionStart);
document.getElementById('btn-start-game').addEventListener('touchend',(e)=>{e.preventDefault();onActionStart();});
document.getElementById('btn-restart-game').addEventListener('click',onActionRestart);
document.getElementById('btn-restart-game').addEventListener('touchend',(e)=>{e.preventDefault();onActionRestart();});
document.getElementById('btn-quit-game').addEventListener('click',onActionQuit);
document.getElementById('btn-quit-game').addEventListener('touchend',(e)=>{e.preventDefault();onActionQuit();});

// ============================================================
// RESIZE HANDLER
// ============================================================
window.addEventListener('resize',()=>{
    resizeGame();
    renderDispatch();
});

// ============================================================
// GAME LOOP
// ============================================================
let lastTickTime=performance.now();
let lastFrameTime=performance.now();
let tickAccumulator=0;

function gameLoop(timestamp){
    processInput();
    const dt=(timestamp-lastTickTime)/1000;
    lastTickTime=timestamp;
    tickAccumulator+=dt;
    while(tickAccumulator>=1.0/TICK_RATE){tick();tickAccumulator-=1.0/TICK_RATE;}
    if(timestamp-lastFrameTime>=TARGET_FRAME){renderDispatch();lastFrameTime=timestamp;}
    requestAnimationFrame(gameLoop);
}

// ============================================================
// INIT
// ============================================================
function init(){
    for(let i=0;i<MAX_PLAYERS;i++)
        gameState.players[i]={body:[],dir:Direction.RIGHT,score:0,alive:false,active:false,nextDir:Direction.STOP};
    appState=AppState.MENU;netRole=NetRole.NONE;localPlayerId=-1;activePlayerCount=0;
    resizeGame();
    showMenu();
    requestAnimationFrame(gameLoop);
}
init();

// Lobby UI polling
setInterval(()=>{
    if(appState===AppState.LOBBY){
        const startHint=document.getElementById('start-hint');
        if(netRole===NetRole.HOST&&activePlayerCount>=1){
            startHint.classList.toggle('hidden',document.getElementById('host-invite-row').style.display==='none');
        }else{startHint.classList.add('hidden');}
    }
    // Keep controller buttons in sync
    updateControllerUI();
},500);

console.log('Snake 4P Multiplayer loaded! Mobile controls ready.');
</script>
