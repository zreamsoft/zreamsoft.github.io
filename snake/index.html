<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Snake - 4P Multiplayer</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
    width:100%; height:100%;
    overflow:hidden;
    touch-action: manipulation;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
}
body {
    background:#0D0D1A;
    font-family:monospace;
    display:flex; justify-content:center; align-items:center;
}
#app-container {
    display:flex; flex-direction:column;
    width:100%; max-width:600px;
    height:100vh; height:100dvh;
}
#game-container {
    position:relative; flex:0 0 auto;
    display:flex; justify-content:center; align-items:center;
    background:#0D0D1A;
}
#gameCanvas { display:block; background:#0D0D1A; }

.overlay, .overlay-fs {
    position:absolute; top:0; left:0;
    width:100%; height:100%;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    pointer-events:none; z-index:10;
}
.overlay-fs {
    position:fixed; left:50%;
    transform:translateX(-50%);
    max-width:600px; height:100dvh;
}
.overlay > *, .overlay-fs > * { pointer-events:auto; }
.hidden { display:none !important; }
.hidden-ctrl { display:none !important; }
.conn-msg { min-height:18px; font-size:clamp(10px,2vw,12px); text-align:center; color:#8888AA; padding:2px 8px; }

.menu-btn {
    background:#1A1A2E; color:#CCCCCC; border:1px solid #00FF88;
    padding:10px 16px; font-family:monospace; font-size:clamp(12px,3vw,16px);
    cursor:pointer; margin:4px; transition:all 0.15s;
    border-radius:6px; min-width:200px; max-width:88vw;
    -webkit-tap-highlight-color:transparent;
}
.menu-btn:hover { background:#00FF88; color:#0D0D1A; }
.menu-btn:active { transform:scale(0.97); background:#00FF88; color:#0D0D1A; }

.title-text {
    color:#00FF88; font-size:clamp(24px,8vw,42px); font-weight:bold;
    letter-spacing:clamp(6px,2vw,12px); margin-bottom:0;
    text-shadow:0 0 20px rgba(0,255,136,0.4);
}
.subtitle { color:#8888AA; font-size:clamp(10px,2.5vw,14px); margin-bottom:20px; text-align:center; padding:0 10px; }
.title-box { display:inline-flex; flex-direction:column; align-items:center; padding:clamp(14px,3vw,24px) clamp(20px,4vw,36px); border:2px solid #00FF88; border-radius:clamp(10px,2vw,16px); background:rgba(0,255,136,0.04); box-shadow:0 0 30px rgba(0,255,136,0.15), inset 0 0 20px rgba(0,255,136,0.04); margin-bottom:clamp(8px,2vw,14px); }
.menu-snakes { display:flex; justify-content:center; align-items:center; gap:clamp(10px,2.5vw,18px); margin:6px 0 0; }
.menu-snake { display:flex; align-items:center; gap:3px; }
.menu-snake .ms-seg { width:10px; height:10px; border-radius:2px; }
.menu-snake .ms-head { width:13px; height:13px; border-radius:3px; position:relative; }
.menu-snake .ms-head::after { content:''; position:absolute; width:4px; height:4px; background:#FFFFFF; border-radius:50%; top:2px; right:2px; }
.hint-text { color:#8888AA; font-size:clamp(10px,2.2vw,12px); margin-top:10px; text-align:center; padding:0 10px; }

.connect-area {
    background:#1A1A2E; border:1px solid #44BBFF; border-radius:4px;
    padding:12px; width:min(500px,92vw); margin:6px 0;
}
.connect-area label { display:block; color:#CCCCCC; font-size:clamp(11px,2.2vw,13px); margin-bottom:4px; }
.connect-area textarea {
    width:100%; height:80px; background:#0D0D1A; color:#00FF88;
    border:1px solid #333; font-family:monospace; font-size:clamp(10px,2vw,12px);
    padding:6px; resize:vertical; outline:none; border-radius:2px;
}
.connect-area textarea:focus { border-color:#00FF88; }
.connect-area .btn-row { display:flex; gap:8px; margin-top:8px; justify-content:center; flex-wrap:wrap; }
.connect-area .a-btn {
    background:#16213E; color:#CCCCCC; border:1px solid #44BBFF;
    padding:8px 14px; font-family:monospace; font-size:clamp(11px,2.2vw,13px);
    cursor:pointer; border-radius:4px; transition:all 0.15s;
    -webkit-tap-highlight-color:transparent;
}
.connect-area .a-btn:hover { background:#44BBFF; color:#0D0D1A; }
.connect-area .a-btn:active { background:#44BBFF; color:#0D0D1A; }
.connect-area .status-text {
    color:#8888AA; font-size:clamp(10px,2vw,12px); margin-top:6px; text-align:center; min-height:16px;
}
.connected-dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle; }
.player-list { margin:4px 0; color:#CCCCCC; font-size:clamp(11px,2.2vw,13px); }
.player-list .p-entry { margin:2px 0; }
.lobby-info { color:#CCCCCC; font-size:clamp(12px,2.5vw,14px); text-align:center; margin:3px 0; }
.lobby-info .highlight { color:#00FF88; }
.status-msg {
    color:#FF4444; font-size:clamp(11px,2.2vw,13px); text-align:center; margin-top:4px; min-height:18px;
}
.code-ready-msg {
    color:#FFBB00; font-size:clamp(16px,4vw,24px); font-weight:bold; text-align:center;
    margin-bottom:8px; letter-spacing:2px;
    text-shadow:0 0 15px rgba(255,187,0,0.5);
    animation:codePulse 1.5s ease-in-out infinite;
}
@keyframes codePulse { 0%,100% { opacity:1; } 50% { opacity:0.6; } }

/* GAME OVER OVERLAY */
.gameover-title {
    color:#FF4444; font-size:clamp(28px,8vw,48px); font-weight:bold;
    letter-spacing:clamp(4px,2vw,10px); margin-bottom:12px;
    text-shadow:0 0 30px rgba(255,68,68,0.5);
}
.gameover-winner {
    color:#CCCCCC; font-size:clamp(16px,4vw,24px); font-weight:bold;
    letter-spacing:2px;
}

/* SCORE BAR */
#scorebar {
    flex:0 0 auto;
    background:#1A1A2E;
    border-bottom:1px solid #00FF88;
    padding:4px 8px;
    display:flex; flex-direction:column;
    justify-content:center;
}
#score-player-list {
    display:flex; flex-wrap:wrap; justify-content:space-around; align-items:center;
    gap:4px;
}
.score-player-entry {
    display:flex; flex-direction:column; align-items:center;
    background:rgba(13,13,26,0.5); border-radius:4px;
    padding:3px 8px; min-width:56px;
}
.score-player-snake {
    display:flex; align-items:center; gap:2px;
    margin-bottom:2px;
}
.score-player-snake .seg {
    width:8px; height:8px;
    border-radius:2px;
}
.score-player-snake .head {
    width:10px; height:10px;
    border-radius:2px;
    position:relative;
}
.score-player-snake .head::after {
    content:''; position:absolute;
    width:3px; height:3px;
    background:#FFFFFF; border-radius:50%;
    top:1px; right:1px;
}
.score-player-score {
    font-size:clamp(12px,2.8vw,16px); font-weight:bold;
}
.score-player-dead {
    font-size:clamp(7px,1.5vw,9px);
    color:#FF4444; font-weight:bold;
}
#game-hint {
    flex:0 0 auto;
    text-align:center;
    padding:3px 8px;
    font-size:clamp(8px,1.8vw,10px);
    color:#8888AA;
    background:#0A0A16;
    border-top:1px solid #16213E;
    min-height:20px;
}

/* CONTROLLER */
#controller-area {
    flex:1; display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    min-height:180px;
    background:#0A0A16;
    border-top:2px solid #00FF88;
    padding:8px;
}
#dpad {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    gap:6px;
    width:min(210px,55vw);
    height:min(210px,55vw);
}
.dpad-btn {
    background:#1A1A2E; border:2px solid #00FF88; border-radius:14px;
    color:#00FF88; font-size:min(28px,7vw);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    transition:background 0.08s,transform 0.08s;
    -webkit-user-select:none; user-select:none;
}
.dpad-btn:active, .dpad-btn.pressed {
    background:#00FF88; color:#0D0D1A; transform:scale(0.92);
}
#btn-up    { grid-column:2; grid-row:1; }
#btn-left  { grid-column:1; grid-row:2; }
#btn-right { grid-column:3; grid-row:2; }
#btn-down  { grid-column:2; grid-row:3; }
#dpad-center { grid-column:2; grid-row:2; background:transparent; border:none; pointer-events:none; }

#action-row {
    display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; justify-content:center;
}
.action-btn {
    background:#1A1A2E; border:1px solid #44BBFF; color:#CCCCCC;
    padding:10px 16px; font-family:monospace; font-size:clamp(12px,3vw,14px);
    border-radius:8px; cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation; min-width:70px;
    transition:all 0.12s;
    -webkit-user-select:none; user-select:none;
}
.action-btn:active { background:#44BBFF; color:#0D0D1A; transform:scale(0.94); }
.hidden-btn { display:none !important; }
</style>
</head>
<body>
<div id="app-container">

    <!-- SCORE BAR -->
    <div id="scorebar" class="hidden-ctrl">
        <div id="score-player-list"></div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- MENU OVERLAY -->
        <div id="menu-overlay" class="overlay-fs">
            <div class="title-box">
                <div class="title-text">SNAKE</div>
                <div class="menu-snakes">
                <div class="menu-snake">
                    <div class="ms-seg" style="background:#00CC66"></div>
                    <div class="ms-seg" style="background:#00CC66"></div>
                    <div class="ms-seg" style="background:#00CC66"></div>
                    <div class="ms-head" style="background:#00FF88"></div>
                </div>
                <div class="menu-snake">
                    <div class="ms-seg" style="background:#3399DD"></div>
                    <div class="ms-seg" style="background:#3399DD"></div>
                    <div class="ms-seg" style="background:#3399DD"></div>
                    <div class="ms-head" style="background:#44BBFF"></div>
                </div>
                <div class="menu-snake">
                    <div class="ms-seg" style="background:#DD9900"></div>
                    <div class="ms-seg" style="background:#DD9900"></div>
                    <div class="ms-seg" style="background:#DD9900"></div>
                    <div class="ms-head" style="background:#FFBB00"></div>
                </div>
                <div class="menu-snake">
                    <div class="ms-seg" style="background:#DD4499"></div>
                    <div class="ms-seg" style="background:#DD4499"></div>
                    <div class="ms-seg" style="background:#DD4499"></div>
                    <div class="ms-head" style="background:#FF66BB"></div>
                </div>
                </div>
            </div>
            <div class="subtitle">4 PLAYER MULTIPLAYER</div>
            <button class="menu-btn" onclick="createGame()">1 - CREATE GAME (HOST)</button>
            <button class="menu-btn" onclick="showJoinUI()">2 - JOIN GAME</button>
            <button class="menu-btn" onclick="showHelp()">3 - HOW TO PLAY</button>
            <div id="menu-status" class="status-msg"></div>
            <div class="hint-text">Use D-Pad / WASD / Arrows to move</div>
            <div class="conn-msg"></div>
        </div>

        <!-- LOBBY OVERLAY -->
        <div id="lobby-overlay" class="overlay-fs hidden">
            <div id="lobby-title" style="color:#00FF88;font-size:clamp(20px,5vw,28px);font-weight:bold;letter-spacing:4px;margin-bottom:4px;">LOBBY</div>
            <div class="lobby-info">Connected: <span id="player-count" class="highlight">0</span>/4</div>
            <div id="host-ip-info" style="color:#8888AA;font-size:clamp(10px,2vw,12px);margin-bottom:4px;"></div>
            <div id="player-list" class="player-list"></div>
            <div id="connect-panel" style="width:min(500px,92vw);margin:4px 0;">
                <div id="host-invite-row" class="hidden" style="text-align:center;margin:6px 0;">
                    <label style="color:#CCCCCC;font-size:clamp(11px,2.2vw,13px);margin-bottom:4px;display:block;">Share this link with friends to invite them:</label>
                    <div style="display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;">
                        <input id="invite-link-input" type="text" readonly
                               style="flex:1;min-width:220px;background:#0D0D1A;color:#00FF88;border:1px solid #333;padding:6px 8px;font-family:monospace;font-size:clamp(10px,2vw,12px);border-radius:2px;">
                        <button class="a-btn" onclick="copyInviteLink()" id="btn-copy-link">Copy Link</button>
                    </div>
                    <div id="sdp-status" class="status-text" style="margin-top:4px;"></div>
                </div>
                <div id="join-area" class="hidden connect-area" style="margin:0 auto;">
                    <label id="join-label" style="color:#CCCCCC;font-size:clamp(11px,2.2vw,13px);margin-bottom:4px;">Enter the host's invite link or peer ID:</label>
                    <textarea id="join-input" placeholder="Paste invite link or peer ID..."></textarea>
                    <div class="btn-row">
                        <button class="a-btn" id="btn-join-submit" onclick="manualJoin()">Join</button>
                        <button class="a-btn" onclick="cancelJoin()">Cancel</button>
                    </div>
                    <div id="join-status" class="status-text"></div>
                </div>
            </div>
            <div id="lobby-wait-msg" style="color:#8888AA;font-size:clamp(11px,2.2vw,13px);margin:4px 0;"></div>
            <div id="start-hint" class="hidden" style="color:#00FF88;font-size:clamp(12px,2.5vw,14px);margin:4px 0;">Tap START or press SPACE to begin!</div>
            <div id="lobby-actions" style="margin-top:10px;display:none;gap:10px;flex-wrap:wrap;justify-content:center;">
                <button class="action-btn" id="btn-lobby-start" style="display:none;">Start Game</button>
                <button class="action-btn" id="btn-lobby-cancel">Cancel</button>
            </div>
            <div class="hint-text">QUIT: Back to menu</div>
            <div class="conn-msg"></div>
        </div>

        <!-- GAME OVER OVERLAY -->
        <div id="gameover-overlay" class="overlay hidden">
            <div class="gameover-title">GAME OVER</div>
            <div id="gameover-winner" class="gameover-winner"></div>
        </div>
    </div>

    <!-- GAME HINT (instruction text) -->
    <div id="game-hint" class="hidden-ctrl"></div>

    <!-- CONTROLLER -->
    <div id="controller-area" class="hidden-ctrl">
        <div id="dpad">
            <button class="dpad-btn" id="btn-up"    data-dir="1">▲</button>
            <button class="dpad-btn" id="btn-left"  data-dir="3">◄</button>
            <div id="dpad-center"></div>
            <button class="dpad-btn" id="btn-right" data-dir="4">►</button>
            <button class="dpad-btn" id="btn-down"  data-dir="2">▼</button>
        </div>
        <div id="action-row">
            <button class="action-btn hidden-btn" id="btn-start-game">START</button>
            <button class="action-btn hidden-btn" id="btn-restart-game">RESTART</button>
            <button class="action-btn hidden-btn" id="btn-quit-game">QUIT</button>
        </div>
    </div>

</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
// ============================================================
// CONSTANTS
// ============================================================
const GRID_W = 40, GRID_H = 20;
const MAX_PLAYERS = 4;
const TICK_RATE = 10.0;
const TARGET_FRAME = 1000 / 60;

// ============================================================
// DYNAMIC SIZING
// ============================================================
let CELL_SIZE = 20;
let BUFFER_W = GRID_W * CELL_SIZE;
let BUFFER_H = GRID_H * CELL_SIZE;
let WIN_W = BUFFER_W;
let WIN_H = BUFFER_H;
let CHAR_PX = 2;

// ============================================================
// COLORS
// ============================================================
const COLORS = {
    BG:'#1A1A2E',GRID:'#16213E',WALL:'#E94560',FOOD:'#FF4444',
    SCORE:'#CCCCCC',EYE:'#FFFFFF',OVERLAY:'rgba(0,0,0,0.53)',
    MENU_BG:'#0D0D1A',TITLE:'#00FF88',HINT:'#8888AA',RED:'#FF4444',
    PLAYER:['#00FF88','#44BBFF','#FFBB00','#FF66BB'],
    BODY:['#00CC66','#3399DD','#DD9900','#DD4499']
};

// ============================================================
// BITMAP GLYPHS (kept for any future canvas rendering needs)
// ============================================================
const DIGIT_GLYPHS = [

    [0b00100,0b01100,0b00100,0b00100,0b00100,0b00100,0b01110],

const LETTER_GLYPHS = [
    [0b01110,0b10001,0b10001,0b11111,0b10001,0b10001,0b10001],
    [0b11110,0b10001,0b10001,0b11110,0b10001,0b10001,0b11110],

    [0b01110,0b10001,0b10001,0b10001,0b10001,0b10001,0b01110],
    [0b11110,0b10001,0b10001,0b11110,0b10000,0b10000,0b10000],

    [0b11110,0b10001,0b10001,0b11110,0b10100,0b10010,0b10001],

const EXTRA_GLYPHS = [
    [0b00000,0b00100,0b00100,0b00000,0b00100,0b00100,0b00000],
    [0b00000,0b00000,0b00000,0b00000,0b00000,0b00000,0b00000]
];
const CHAR_W=5,CHAR_H=7;

// ============================================================
// ENUMS
// ============================================================
const Direction={STOP:0,UP:1,DOWN:2,LEFT:3,RIGHT:4};
const AppState={MENU:0,LOBBY:1,PLAYING:2};
const NetRole={NONE:0,HOST:1,CLIENT:2};
const PacketType={JOIN_ACCEPT:0,PLAYER_INPUT:1,GAME_STATE:2,LOBBY_STATE:3,JOIN_REQUEST:4,HEARTBEAT:5,HEARTBEAT_ACK:6,PLAYER_LEAVE:7};

// ============================================================
// CANVAS SETUP
// ============================================================
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');

function resizeGame(){
    const pad=16;
    const maxW=window.innerWidth-pad;
    const maxH=window.innerHeight*(appState===AppState.PLAYING?0.65:0.55);
    let cs=Math.floor(maxW/GRID_W);
    cs=Math.max(8,cs);
    let totH=GRID_H*cs;
    if(totH>maxH){
        cs=Math.floor(maxH/GRID_H);
        cs=Math.max(8,cs);
    }
    CELL_SIZE=cs;
    BUFFER_W=GRID_W*CELL_SIZE;
    BUFFER_H=GRID_H*CELL_SIZE;
    WIN_W=BUFFER_W;
    WIN_H=BUFFER_H;
    CHAR_PX=Math.max(1,Math.round(CELL_SIZE/10));
    canvas.width=WIN_W;
    canvas.height=WIN_H;
    document.getElementById('game-container').style.height=WIN_H+'px';
}

// ============================================================

// ============================================================
// FRIENDLY PEER ID GENERATION
// ============================================================
const ADJECTIVES='cool fast bold calm wise keen pure safe warm mild dark soft high low true glad kind deep rare slim busy free snug wild'.split(' ');
const NOUNS='panda tiger eagle otter fox bear wolf deer hawk owl seal mole dove lynx hare kite loon ram cat elk doe eel bat'.split(' ');
function randomSuffix(n){
    const c='abcdefghijklmnopqrstuvwxyz0123456789';
    let s='';for(let i=0;i<n;i++)s+=c[Math.floor(Math.random()*c.length)];
    return s;
}
function generateFriendlyId(){
    const adj=ADJECTIVES[Math.floor(Math.random()*ADJECTIVES.length)];
    const noun=NOUNS[Math.floor(Math.random()*NOUNS.length)];
    return adj+'-'+noun+'-'+randomSuffix(4);
}

// ============================================================
// GAME LOGIC
// ============================================================
function genFood(){
    let ok;
    do{
        ok=true;
        gameState.food.x=1+Math.floor(Math.random()*(GRID_W-2));
        gameState.food.y=1+Math.floor(Math.random()*(GRID_H-2));
        for(let p=0;p<MAX_PLAYERS;p++){
            if(!gameState.players[p].active)continue;
            for(const seg of gameState.players[p].body){
                if(seg.x===gameState.food.x&&seg.y===gameState.food.y){ok=false;break;}
            }
            if(!ok)break;
        }
    }while(!ok);
}
function spawnPlayer(id){
    const p=gameState.players[id];
    p.body=[];p.score=0;p.alive=true;p.dir=Direction.RIGHT;p.nextDir=Direction.STOP;
    const spawns=[{x:Math.floor(GRID_W/4),y:Math.floor(GRID_H/2)},{x:Math.floor(3*GRID_W/4),y:Math.floor(GRID_H/2)},{x:Math.floor(GRID_W/2),y:Math.floor(GRID_H/4)},{x:Math.floor(GRID_W/2),y:Math.floor(3*GRID_H/4)}];
    const sx=spawns[id].x,sy=spawns[id].y;
    p.body.push({x:sx,y:sy},{x:sx-1,y:sy},{x:sx-2,y:sy});
}
function resetAll(){
    for(let i=0;i<MAX_PLAYERS;i++){
        if(gameState.players[i].active)spawnPlayer(i);
        else{gameState.players[i].body=[];gameState.players[i].alive=false;}
    }
    gameState.gameOver=false;genFood();
    gameState.aliveCount=0;
    for(const p of gameState.players)if(p.alive)gameState.aliveCount++;
}
function startMatch(){
    resetAll();gameState.aliveCount=0;
    for(const p of gameState.players)if(p.active)gameState.aliveCount++;
    appState=AppState.PLAYING;hideAllOverlays();
    canvas.style.display='block';
    document.getElementById('scorebar').classList.remove('hidden-ctrl');
    document.getElementById('gameover-overlay').classList.add('hidden');
    updateControllerUI();
}
function hostPrepare(){
    for(let i=0;i<MAX_PLAYERS;i++)
        gameState.players[i]={body:[],dir:Direction.RIGHT,score:0,alive:false,active:false,nextDir:Direction.STOP};
    gameState.players[0].active=true;activePlayerCount=1;localPlayerId=0;
    playerConnectionType=new Array(MAX_PLAYERS).fill('');playerConnectionType[0]='direct';
    spawnPlayer(0);genFood();appState=AppState.LOBBY;
}
function updatePlayer(id){
    const p=gameState.players[id];
    if(!p.alive||p.body.length===0)return;
    let md=p.dir;
    if(p.nextDir!==Direction.STOP){
        const opp=(p.dir===Direction.UP&&p.nextDir===Direction.DOWN)||
                 (p.dir===Direction.DOWN&&p.nextDir===Direction.UP)||
                 (p.dir===Direction.LEFT&&p.nextDir===Direction.RIGHT)||
                 (p.dir===Direction.RIGHT&&p.nextDir===Direction.LEFT);
        if(!opp)md=p.nextDir;
        p.dir=md;p.nextDir=Direction.STOP;
    }
    const nh={x:p.body[0].x,y:p.body[0].y};
    switch(md){
        case Direction.UP:nh.y--;break;
        case Direction.DOWN:nh.y++;break;
        case Direction.LEFT:nh.x--;break;
        case Direction.RIGHT:nh.x++;break;
        default:return;
    }
    if(nh.x<=0||nh.x>=GRID_W-1||nh.y<=0||nh.y>=GRID_H-1){p.alive=false;gameState.aliveCount--;return;}
    const ate=(nh.x===gameState.food.x&&nh.y===gameState.food.y);
    p.body.unshift({x:nh.x,y:nh.y});
    if(ate){p.score+=10;genFood();}else p.body.pop();
    for(let i=1;i<p.body.length;i++){
        if(p.body[0].x===p.body[i].x&&p.body[0].y===p.body[i].y){p.alive=false;gameState.aliveCount--;return;}
    }
    for(let o=0;o<MAX_PLAYERS;o++){
        if(o===id||!gameState.players[o].alive)continue;
        for(const seg of gameState.players[o].body){
            if(p.body[0].x===seg.x&&p.body[0].y===seg.y){p.alive=false;gameState.aliveCount--;return;}
        }
    }
}
function tick(){
    if(netRole!==NetRole.HOST||appState!==AppState.PLAYING)return;
    tickCounter++;
    for(let i=0;i<MAX_PLAYERS;i++)if(gameState.players[i].alive)updatePlayer(i);
    let alive=0;for(const p of gameState.players)if(p.alive)alive++;
    if(alive===0&&!gameState.gameOver)gameState.gameOver=true;
    sendGameState();
    // Heartbeat: send every 50 ticks (5s at 10 ticks/sec)
    if(tickCounter%50===0){
        for(let i=1;i<MAX_PLAYERS;i++){
            if(hostConnections[i]&&gameState.players[i].active)
                sendPkt(hostConnections[i],PacketType.HEARTBEAT,null);
        }
    }
    // Heartbeat timeout check: every 10 ticks (1s)
    if(tickCounter%10===0){
        for(let i=1;i<MAX_PLAYERS;i++){
            if(hostConnections[i]&&lastAckTick[i]>=0&&tickCounter-lastAckTick[i]>100)
                handlePlayerDisconnect(i);
        }
    }
}

// ============================================================
// NETWORKING
// ============================================================
function sendPkt(dc,type,data){
    if(!dc||!dc.open)return false;
    const len=1+(data?data.byteLength:0);
    const buf=new ArrayBuffer(len);
    const v=new Uint8Array(buf);
    v[0]=type;
    if(data)v.set(new Uint8Array(data),1);
    dc.send(buf);
    return true;
}
function sendGameState(){
    let size=4;
    for(let i=0;i<MAX_PLAYERS;i++){size+=5;size+=gameState.players[i].body.length*2;}
    const buf=new ArrayBuffer(size);
    const v=new Uint8Array(buf);
    let o=0;
    v[o++]=gameState.food.x;v[o++]=gameState.food.y;
    v[o++]=gameState.gameOver?1:0;v[o++]=gameState.aliveCount;
    for(let i=0;i<MAX_PLAYERS;i++){
        const p=gameState.players[i];
        v[o++]=p.active?1:0;v[o++]=p.alive?1:0;v[o++]=p.score;v[o++]=p.dir;v[o++]=p.body.length;
        for(const seg of p.body){v[o++]=seg.x;v[o++]=seg.y;}
    }
    for(let i=1;i<hostConnections.length;i++){
        if(hostConnections[i]&&hostConnections[i].open)sendPkt(hostConnections[i],PacketType.GAME_STATE,buf);
    }
}
function parseGameState(data){
    const v=new Uint8Array(data);
    let o=0;
    gameState.food={x:v[o++],y:v[o++]};
    gameState.gameOver=v[o++]!==0;gameState.aliveCount=v[o++];
    for(let i=0;i<MAX_PLAYERS;i++){
        const p=gameState.players[i];
        if(o>=v.length)break;
        p.active=v[o++]!==0;p.alive=v[o++]!==0;p.score=v[o++];p.dir=v[o++];
        const bl=v[o++];p.body=[];
        for(let b=0;b<bl;b++){if(o+1>=v.length)break;p.body.push({x:v[o++],y:v[o++]});}
    }
}
function setupHostDataConnection(conn, slot){
    const playerId=slot;
    let joined=false;
    conn.on('data',(data)=>{
        const v=new Uint8Array(data);
        if(v.length<1)return;
        const type=v[0];const d=v.slice(1);
        if(type===PacketType.JOIN_REQUEST&&!joined){
            if(gameState.players[playerId].active)return;
            joined=true;
            gameState.players[playerId].active=true;
            activePlayerCount++;
            lastAckTick[slot]=tickCounter;
            if(appState===AppState.LOBBY)spawnPlayer(playerId);
            const buf=new ArrayBuffer(1);
            const v2=new Uint8Array(buf);
            v2[0]=playerId;
            sendPkt(conn,PacketType.JOIN_ACCEPT,buf);
            playerConnectionType[playerId]='direct';
            updateLobbyUI();
            broadcastLobbyState();
            setConnectionStatus('Player '+(playerId+1)+' connected!');
            document.getElementById('host-invite-row').classList.add('hidden');
            return;
        }
        if(!joined)return;
        if(type===PacketType.PLAYER_INPUT&&d.length>=1){
            const dir=d[0];
            const p=gameState.players[playerId];
            if(p&&p.alive){
                let lq=p.nextDir;
                if(lq===Direction.STOP)lq=p.dir;
                const opp=(lq===Direction.UP&&dir===Direction.DOWN)||
                         (lq===Direction.DOWN&&dir===Direction.UP)||
                         (lq===Direction.LEFT&&dir===Direction.RIGHT)||
                         (lq===Direction.RIGHT&&dir===Direction.LEFT);
                if(!opp)p.nextDir=dir;
            }
            return;
        }
        if(type===PacketType.HEARTBEAT_ACK){
            lastAckTick[slot]=tickCounter;
            return;
        }
        if(type===PacketType.PLAYER_LEAVE){
            handlePlayerDisconnect(slot);
            return;
        }
    });
    conn.on('close',()=>{
        handlePlayerDisconnect(slot);
    });
}

function handlePlayerDisconnect(slot){
    if(slot<1||slot>=MAX_PLAYERS)return;
    if(playerDisconnected[slot])return;
    playerDisconnected[slot]=true;
    if(hostConnections[slot]){
        const conn=hostConnections[slot];
        hostConnections[slot]=null;
        try{conn.close();}catch(e){}
    }
    if(gameState.players[slot].active){
        gameState.players[slot].active=false;
        gameState.players[slot].alive=false;
        gameState.players[slot].body=[];
        playerConnectionType[slot]='';
        lastAckTick[slot]=-1;
        activePlayerCount--;
        if(appState===AppState.LOBBY){
            updateLobbyUI();
            broadcastLobbyState();
        }
    }
}
function broadcastLobbyState(){
    const buf=new ArrayBuffer(1+MAX_PLAYERS*2);
    const v=new Uint8Array(buf);
    v[0]=PacketType.LOBBY_STATE;
    for(let i=0;i<MAX_PLAYERS;i++){
        v[1+i]=gameState.players[i].active?1:0;
        const ct=playerConnectionType[i];
        v[1+MAX_PLAYERS+i]=ct==='direct'?1:(ct==='relay'?2:0);
    }
    for(let i=1;i<hostConnections.length;i++){
        if(hostConnections[i]&&hostConnections[i].open){
            hostConnections[i].send(buf);
        }
    }
}
function onClientMessage(raw){
    const v=new Uint8Array(raw);
    if(v.length<1)return;
    const type=v[0];const data=v.slice(1);
    if(type===PacketType.JOIN_ACCEPT&&data.length>=1){
        localPlayerId=data[0];
        gameState.players[localPlayerId].active=true;
        activePlayerCount++;
        netRole=NetRole.CLIENT;
        setStatusMsg('You are P'+(localPlayerId+1),300);
        setConnectionStatus('Connected to host!');
        document.getElementById('join-area').classList.add('hidden');
        pendingConnection=null;
        updateLobbyUI();
        updateControllerUI();
    }else if(type===PacketType.GAME_STATE&&data.length>=4){
        lastGameStateTime=Date.now();
        parseGameState(data);
        if(appState!==AppState.PLAYING){
            appState=AppState.PLAYING;
            hideAllOverlays();
            canvas.style.display='block';
            document.getElementById('scorebar').classList.remove('hidden-ctrl');
            document.getElementById('gameover-overlay').classList.add('hidden');
            updateControllerUI();
        }
    }else if(type===PacketType.LOBBY_STATE&&data.length>=MAX_PLAYERS*2){
        let count=0;
        for(let i=0;i<MAX_PLAYERS;i++){
            const active=data[i]!==0;
            gameState.players[i].active=active;
            if(active)count++;
            const ctVal=data[MAX_PLAYERS+i];
            playerConnectionType[i]=ctVal===1?'direct':(ctVal===2?'relay':'');
        }
        activePlayerCount=count;
        updateLobbyUI();
    }else if(type===PacketType.HEARTBEAT){
        sendPkt(clientConnection,PacketType.HEARTBEAT_ACK,null);
    }else if(type===PacketType.PLAYER_LEAVE){
        setStatusMsg('Host disconnected',300);
        cleanupClient();
        appState=AppState.MENU;
        showMenu();
        updateControllerUI();
    }
}
function cleanupHost(){
    for(let i=1;i<hostConnections.length;i++){
        if(hostConnections[i]){try{hostConnections[i].close();}catch(e){}}
        hostConnections[i]=null;
    }
    lastAckTick=new Array(MAX_PLAYERS).fill(-1);
    playerDisconnected=new Array(MAX_PLAYERS).fill(false);
    if(hostPeer){try{hostPeer.destroy();}catch(e){}}hostPeer=null;netRole=NetRole.NONE;
    activePlayerCount=0;localPlayerId=-1;
    playerConnectionType=new Array(MAX_PLAYERS).fill('');
    clearIceStatus();
    document.getElementById('host-invite-row').classList.add('hidden');
}
function cleanupClient(){
    if(pendingConnection){try{pendingConnection.close();}catch(e){}pendingConnection=null;}
    if(clientConnection){try{clientConnection.close();}catch(e){}clientConnection=null;}
    if(clientPeer){try{clientPeer.destroy();}catch(e){}}clientPeer=null;
    netRole=NetRole.NONE;localPlayerId=-1;
    clearIceStatus();
}
function cleanupAll(){cleanupHost();cleanupClient();}

// ===== Friendly Peer ID with retry =====
function createPeerWithFriendlyId(){
    return new Promise((resolve,reject)=>{
        let attempts=0;
        function tryCreate(){
            const id=generateFriendlyId();
            const p=new Peer(id,{config: ICE_CONFIG});
            p.on('open',()=>resolve({peer:p, id:p.id}));
            p.on('error',(err)=>{
                if(err.type==='id-taken'&&attempts<5){
                    attempts++;
                    p.destroy();
                    tryCreate();
                }else{reject(err);}
            });
        }
        tryCreate();
    });
}

// ===== CREATE GAME (HOST) =====
async function createGame(){
    cleanupAll();
    netRole=NetRole.HOST;
    hostPrepare();
    hideAllOverlays();
    canvas.style.display='none';
    document.getElementById('lobby-overlay').classList.remove('hidden');
    document.getElementById('lobby-actions').style.display='flex';
    updateLobbyUI();
    updateControllerUI();

    try{
        const result=await createPeerWithFriendlyId();
        hostPeer=result.peer;
        hostPeer.on('connection',(conn)=>{
            let slot=-1;
            for(let i=1;i<MAX_PLAYERS;i++){if(!hostConnections[i]){slot=i;break;}}
            if(slot===-1){try{conn.close();}catch(e){}return;}
            hostConnections[slot]=conn;
            playerDisconnected[slot]=false;
            setupHostDataConnection(conn,slot);
        });
        hostPeer.on('error',(err)=>{
            console.error('PeerJS error:',err);
            setConnectionStatus('Error: '+err.type);
        });
        setConnectionStatus('Your game ID: '+result.id);
        const link=window.location.origin+window.location.pathname+'?join='+result.id;
        document.getElementById('invite-link-input').value=link;
        document.getElementById('host-invite-row').classList.remove('hidden');
        document.getElementById('lobby-wait-msg').textContent='Share the invite link with friends!';
    }catch(e){
        console.error('Failed to create peer:',e);
        setConnectionStatus('Failed to create game. Try again.');
    }

    try{
        const resp=await fetch('https://api.ipify.org?format=json');
        const data=await resp.json();
        document.getElementById('host-ip-info').textContent='Public IP: '+data.ip+' : 8888';
    }catch(e){
        document.getElementById('host-ip-info').textContent='LAN mode (share IP manually)';
    }
}

async function manualJoin(){
    const input=document.getElementById('join-input').value.trim();
    if(!input){document.getElementById('join-status').textContent='Enter the host\'s peer ID or invite link.';return;}
    let peerId=input;
    try{
        const url=new URL(input);
        const j=url.searchParams.get('join');
        if(j)peerId=j;
    }catch(e){/* not a URL, treat as raw peer ID */}
    document.getElementById('join-status').textContent='Connecting...';
    await connectToHost(peerId, true);
}

async function connectToHost(peerId, autoJoin){
    if(clientPeer){cleanupClient();}
    pendingConnection=null;
    clientPeer=new Peer({config: ICE_CONFIG});
    clientPeer.on('open',()=>{
        document.getElementById('join-status').textContent='Connecting to host...';
        const conn=clientPeer.connect(peerId);
        pendingConnection=conn;
        conn.on('open',()=>{
            if(autoJoin){
                doJoin();
            }else{
                document.getElementById('join-status').textContent='Game found! Click JOIN to connect.';
                document.getElementById('btn-join-submit').textContent='JOIN GAME';
                document.getElementById('btn-join-submit').disabled=false;
                document.getElementById('btn-join-submit').onclick=doJoin;
                document.getElementById('join-input').style.display='none';
            }
        });
        conn.on('data',onClientMessage);
        conn.on('close',()=>{
            if(!clientConnection){
                document.getElementById('join-status').textContent='Connection lost. The host may have left.';
                document.getElementById('btn-join-submit').textContent='Cancel';
                document.getElementById('btn-join-submit').onclick=cancelJoin;
            }else{
                setStatusMsg('Disconnected from host',300);
                cleanupClient();
                appState=AppState.MENU;
                showMenu();
                updateControllerUI();
            }
        });
    });
    clientPeer.on('error',(err)=>{
        console.error('Client PeerJS error:',err);
        document.getElementById('join-status').textContent='Game not found: '+err.type;
        cleanupClient();
    });
}

function doJoin(){
    const conn=pendingConnection;
    if(!conn||!conn.open)return;
    const buf=new ArrayBuffer(1);
    const v=new Uint8Array(buf);
    v[0]=PacketType.JOIN_REQUEST;
    conn.send(buf);
    clientConnection=conn;
    document.getElementById('join-status').textContent='Joining game...';
    document.getElementById('btn-join-submit').disabled=true;
}

function cancelJoin(){
    cleanupClient();
    document.getElementById('lobby-overlay').classList.add('hidden');
    document.getElementById('menu-overlay').classList.remove('hidden');
    document.getElementById('controller-area').classList.add('hidden-ctrl');
    document.getElementById('scorebar').classList.add('hidden-ctrl');
    canvas.style.display='none';
    appState=AppState.MENU;
}

function showHelp(){setStatusMsg('Last snake alive wins! Eat food (+10) to grow. Use D-Pad/WASD/Arrows to move.',300);}

// ===== AUTO-JOIN FROM URL =====
function checkAutoJoin(){
    const params=new URLSearchParams(window.location.search);
    const joinId=params.get('join');
    if(joinId){
        setTimeout(()=>{
            showJoinUI();
            document.getElementById('join-input').value=joinId;
            document.getElementById('join-input').style.display='none';
            document.getElementById('btn-join-submit').disabled=true;
            document.getElementById('btn-join-submit').textContent='Looking...';
            connectToHost(joinId);
        },500);
    }
}

// ============================================================
// UPDATE LOBBY UI
// ============================================================
function updateLobbyUI(){
    document.getElementById('player-count').textContent=activePlayerCount;
    const listEl=document.getElementById('player-list');
    let html='';
    for(let i=0;i<MAX_PLAYERS;i++){
        if(gameState.players[i].active){
            const color=COLORS.PLAYER[i];
            const you=(i===localPlayerId)?' (YOU)':'';
            const ctype=playerConnectionType[i];
            html+='<div class="p-entry"><span class="connected-dot" style="background:'+color+'"></span>Player '+(i+1)+you+(i===0?' (Host)':(ctype?' ('+ctype.charAt(0).toUpperCase()+ctype.slice(1)+')':''))+'</div>';
        }
    }
    listEl.innerHTML=html;
    const startHint=document.getElementById('start-hint');
    const btnLobbyStart=document.getElementById('btn-lobby-start');
    if(netRole===NetRole.HOST&&activePlayerCount>=1){
        const inviteRow=document.getElementById('host-invite-row');
        startHint.classList.toggle('hidden',inviteRow.classList.contains('hidden'));
        btnLobbyStart.style.display='inline-block';
    }else{
        startHint.classList.add('hidden');
        btnLobbyStart.style.display='none';
    }
    if(netRole===NetRole.HOST){
        document.getElementById('lobby-title').textContent='LOBBY (HOST)';
        document.getElementById('lobby-wait-msg').textContent='Tap START or press SPACE to begin!';
    }else if(netRole===NetRole.CLIENT){
        document.getElementById('lobby-title').textContent='LOBBY';
        document.getElementById('lobby-wait-msg').textContent='Waiting for host to start...';
    }else{
        document.getElementById('lobby-title').textContent='LOBBY';
        document.getElementById('lobby-wait-msg').textContent='Enter the invite link or peer ID to join.';
    }
}

// ============================================================
// IN-GAME HTML UI UPDATES (replaces canvas text rendering)
// ============================================================
function updateScoreBar(){
    if(appState!==AppState.PLAYING)return;
    const listEl=document.getElementById('score-player-list');
    let html='';
    for(let i=0;i<MAX_PLAYERS;i++){
        if(!gameState.players[i].active)continue;
        const pColor=COLORS.PLAYER[i];
        const bColor=COLORS.BODY[i];
        const dead=!gameState.players[i].alive&&!gameState.gameOver;
        const opacity=dead?'0.4':'1';
        html+='<div class="score-player-entry">';
        html+='<div class="score-player-snake" style="opacity:'+opacity+'">';
        for(let s=0;s<3;s++){
            html+='<div class="seg" style="background:'+bColor+'"></div>';
        }
        html+='<div class="head" style="background:'+pColor+'"></div>';
        html+='</div>';
        html+='<span class="score-player-score" style="color:'+pColor+'">'+gameState.players[i].score+'</span>';
        if(dead){
            html+='<span class="score-player-dead">DEAD</span>';
        }
        html+='</div>';
    }
    listEl.innerHTML=html;

    const hintEl=document.getElementById('game-hint');
    if(gameState.gameOver){
        if(netRole===NetRole.HOST){
            hintEl.textContent='RESTART: R key / Tap button';
        }else{
            hintEl.textContent='Waiting for host to restart...';
        }
    }else{
        hintEl.textContent='D-Pad: Move  |  Quit: Back / X key';
    }
}

function updateGameOverOverlay(){
    const overlay=document.getElementById('gameover-overlay');
    if(appState===AppState.PLAYING&&gameState.gameOver){
        overlay.classList.remove('hidden');
        let wid=-1,ms=-1;
        for(let i=0;i<MAX_PLAYERS;i++){
            if(gameState.players[i].active&&gameState.players[i].alive){wid=i;break;}
            if(gameState.players[i].active&&gameState.players[i].score>ms){ms=gameState.players[i].score;wid=i;}
        }
        const winnerEl=document.getElementById('gameover-winner');
        if(wid>=0){
            winnerEl.textContent='Player '+(wid+1)+' Wins!';
            winnerEl.style.color=COLORS.PLAYER[wid];
        }else{
            winnerEl.textContent='Draw!';
            winnerEl.style.color='#CCCCCC';
        }
    }else{
        overlay.classList.add('hidden');
    }
}

// ============================================================
// RENDERING
// ============================================================
function renderMenu(){fillRect(0,0,WIN_W,WIN_H,'#0D0D1A');}
function renderLobby(){fillRect(0,0,WIN_W,WIN_H,'#0D0D1A');}
function renderGame(){
    fillRect(0,0,BUFFER_W,BUFFER_H,'#1A1A2E');
    ctx.fillStyle='#16213E';
    for(let gx=0;gx<GRID_W;gx++)
        for(let gy=0;gy<GRID_H;gy++)
            ctx.fillRect(gx*CELL_SIZE,gy*CELL_SIZE,1,1);
    for(let gx=0;gx<GRID_W;gx++){drawCell(gx,0,'#E94560');drawCell(gx,GRID_H-1,'#E94560');}
    for(let gy=0;gy<GRID_H;gy++){drawCell(0,gy,'#E94560');drawCell(GRID_W-1,gy,'#E94560');}
    const fx=gameState.food.x*CELL_SIZE,fy=gameState.food.y*CELL_SIZE;
    const t=performance.now();
    const pulse=0.85+Math.sin(t*0.005)*0.15;
    const gs=0.5+Math.sin(t*0.005)*0.5;
    const hue=(t*0.05)%360;
    const s=(CELL_SIZE-2)*pulse;
    const o=(CELL_SIZE-s)/2;
    ctx.save();
    ctx.shadowColor=`hsl(${hue},100%,60%)`;
    ctx.shadowBlur=14*gs;
    ctx.fillStyle=`hsl(${hue},100%,60%)`;
    ctx.fillRect(fx+o,fy+o,s,s);
    ctx.restore();
    for(let p=0;p<MAX_PLAYERS;p++){
        const pl=gameState.players[p];
        if(!pl.active||pl.body.length===0)continue;
        for(let i=0;i<pl.body.length;i++){
            const seg=pl.body[i];
            if(i===0){
                const px=seg.x*CELL_SIZE,py=seg.y*CELL_SIZE;
                fillRect(px,py,CELL_SIZE,CELL_SIZE,COLORS.PLAYER[p]);
                ctx.fillStyle='#FFFFFF';
                const eyeOff=Math.max(2,Math.round(CELL_SIZE*0.35));
                const eyeSize=Math.max(1,Math.round(CELL_SIZE*0.1));
                ctx.fillRect(px+eyeOff,py+eyeOff,eyeSize,eyeSize);
                ctx.fillRect(px+CELL_SIZE-eyeOff-eyeSize,py+eyeOff,eyeSize,eyeSize);
            }else drawCell(seg.x,seg.y,COLORS.BODY[p]);
        }
    }
}
function renderDispatch(){
    ctx.clearRect(0,0,WIN_W,WIN_H);
    switch(appState){
        case AppState.MENU:renderMenu();break;
        case AppState.LOBBY:renderLobby();break;
        case AppState.PLAYING:renderGame();updateScoreBar();updateGameOverOverlay();break;
    }
}

// ============================================================
// INPUT: KEYBOARD (desktop fallback)
// ============================================================
document.addEventListener('keydown',(e)=>{
    if(e.repeat)return;
    if(appState===AppState.MENU){
        switch(e.key){
            case '1':if(!document.getElementById('menu-overlay').classList.contains('hidden'))createGame();break;
            case '2':if(!document.getElementById('menu-overlay').classList.contains('hidden'))showJoinUI();break;
            case '3':if(!document.getElementById('menu-overlay').classList.contains('hidden'))showHelp();break;
            case 'x':case 'Escape':window.close();break;
        }
        return;
    }
    if(appState===AppState.LOBBY){
        if(e.key===' '||e.key==='Space'){e.preventDefault();onActionStart();}
        if(e.key==='x'||e.key==='Escape'){onActionQuit();}
        return;
    }
    if(appState===AppState.PLAYING){
        if(e.key==='x'||e.key==='Escape'){onActionQuit();return;}
        if(e.key==='r'||e.key==='R'){onActionRestart();return;}
    }
});

const keys={};
document.addEventListener('keydown',(e)=>{if(!e.repeat)keys[e.key]=true;});
document.addEventListener('keyup',(e)=>{keys[e.key]=false;});

function processInput(){
    if(appState!==AppState.PLAYING||gameState.gameOver)return;
    let nd=Direction.STOP;
    if(keys['ArrowUp']||keys['w']||keys['W'])nd=Direction.UP;
    else if(keys['ArrowDown']||keys['s']||keys['S'])nd=Direction.DOWN;
    else if(keys['ArrowLeft']||keys['a']||keys['A'])nd=Direction.LEFT;
    else if(keys['ArrowRight']||keys['d']||keys['D'])nd=Direction.RIGHT;
    // Touch direction (set by dpad)
    if(touchDir!==Direction.STOP)nd=touchDir;
    if(nd!==Direction.STOP){
        if(netRole===NetRole.HOST&&localPlayerId>=0){
            const p=gameState.players[localPlayerId];
            let lq=p.nextDir;if(lq===Direction.STOP)lq=p.dir;
            const opp=(lq===Direction.UP&&nd===Direction.DOWN)||
                      (lq===Direction.DOWN&&nd===Direction.UP)||
                      (lq===Direction.LEFT&&nd===Direction.RIGHT)||
                      (lq===Direction.RIGHT&&nd===Direction.LEFT);
            if(!opp)p.nextDir=nd;
        }else if(netRole===NetRole.CLIENT&&clientConnection&&clientConnection.open){
            const buf=new ArrayBuffer(1);
            const v=new Uint8Array(buf);
            v[0]=nd;
            sendPkt(clientConnection,PacketType.PLAYER_INPUT,buf);
        }
    }
}

// ============================================================
// INPUT: TOUCH D-PAD
// ============================================================
let touchDir=Direction.STOP;
const dpadBtns=document.querySelectorAll('.dpad-btn');

function setTouchDir(dir){
    touchDir=dir;
    // Highlight the active dpad button
    dpadBtns.forEach(b=>{
        if(parseInt(b.dataset.dir)===dir)b.classList.add('pressed');
        else b.classList.remove('pressed');
    });
}
function clearTouchDir(){
    touchDir=Direction.STOP;
    dpadBtns.forEach(b=>b.classList.remove('pressed'));
}

dpadBtns.forEach(btn=>{
    const dir=parseInt(btn.dataset.dir);
    // Touch events
    btn.addEventListener('touchstart',(e)=>{
        e.preventDefault();
        setTouchDir(dir);
    },{passive:false});
    btn.addEventListener('touchend',(e)=>{
        e.preventDefault();
        clearTouchDir();
    },{passive:false});
    btn.addEventListener('touchcancel',(e)=>{
        clearTouchDir();
    });
    // Mouse events (for desktop testing of dpad)
    btn.addEventListener('mousedown',(e)=>{
        e.preventDefault();
        setTouchDir(dir);
    });
    btn.addEventListener('mouseup',(e)=>{
        e.preventDefault();
        clearTouchDir();
    });
    btn.addEventListener('mouseleave',(e)=>{
        clearTouchDir();
    });
});

// Prevent scrolling when using the controller area
document.getElementById('controller-area').addEventListener('touchmove',(e)=>{
    e.preventDefault();
},{passive:false});

// ============================================================
// ACTION BUTTON WIRING
// ============================================================
document.getElementById('btn-start-game').addEventListener('click',onActionStart);
document.getElementById('btn-start-game').addEventListener('touchend',(e)=>{e.preventDefault();onActionStart();});
document.getElementById('btn-restart-game').addEventListener('click',onActionRestart);
document.getElementById('btn-restart-game').addEventListener('touchend',(e)=>{e.preventDefault();onActionRestart();});
document.getElementById('btn-quit-game').addEventListener('click',onActionQuit);
document.getElementById('btn-quit-game').addEventListener('touchend',(e)=>{e.preventDefault();onActionQuit();});

document.getElementById('btn-lobby-start').addEventListener('click',onActionStart);
document.getElementById('btn-lobby-start').addEventListener('touchend',(e)=>{e.preventDefault();onActionStart();});
document.getElementById('btn-lobby-cancel').addEventListener('click',onActionQuit);
document.getElementById('btn-lobby-cancel').addEventListener('touchend',(e)=>{e.preventDefault();onActionQuit();});

// ============================================================
// RESIZE HANDLER
// ============================================================
window.addEventListener('resize',()=>{
    resizeGame();
    renderDispatch();
});

// ============================================================
// BROWSER CLOSE DETECTION (best-effort)
// ============================================================
window.addEventListener('beforeunload',()=>{
    if(netRole===NetRole.CLIENT&&clientConnection&&clientConnection.open){
        try{
            const buf=new ArrayBuffer(1);
            const v=new Uint8Array(buf);
            v[0]=PacketType.PLAYER_LEAVE;
            clientConnection.send(buf);
        }catch(e){}
    }else if(netRole===NetRole.HOST){
        const buf=new ArrayBuffer(1);
        const v=new Uint8Array(buf);
        v[0]=PacketType.PLAYER_LEAVE;
        for(let i=1;i<MAX_PLAYERS;i++){
            if(hostConnections[i]&&hostConnections[i].open){
                try{hostConnections[i].send(buf);}catch(e){}
            }
        }
    }
});

// ============================================================
// GAME LOOP
// ============================================================
let lastTickTime=performance.now();
let lastFrameTime=performance.now();
let tickAccumulator=0;

function gameLoop(timestamp){
    processInput();
    const dt=(timestamp-lastTickTime)/1000;
    lastTickTime=timestamp;
    tickAccumulator+=dt;
    while(tickAccumulator>=1.0/TICK_RATE){tick();tickAccumulator-=1.0/TICK_RATE;}
    if(timestamp-lastFrameTime>=TARGET_FRAME){renderDispatch();lastFrameTime=timestamp;}
    requestAnimationFrame(gameLoop);
}

// ============================================================
// INIT
// ============================================================
function init(){
    for(let i=0;i<MAX_PLAYERS;i++)
        gameState.players[i]={body:[],dir:Direction.RIGHT,score:0,alive:false,active:false,nextDir:Direction.STOP};
    appState=AppState.MENU;netRole=NetRole.NONE;localPlayerId=-1;activePlayerCount=0;
    playerConnectionType=new Array(MAX_PLAYERS).fill('');
    lastAckTick=new Array(MAX_PLAYERS).fill(-1);
    tickCounter=0;
    lastGameStateTime=0;
    playerDisconnected=new Array(MAX_PLAYERS).fill(false);
    hostConnections=new Array(MAX_PLAYERS).fill(null);
    resizeGame();
    showMenu();
    requestAnimationFrame(gameLoop);
}
init();
checkAutoJoin();

// Lobby UI polling
setInterval(()=>{
    if(appState===AppState.LOBBY){
        const startHint=document.getElementById('start-hint');
        if(netRole===NetRole.HOST&&activePlayerCount>=1){
            startHint.classList.toggle('hidden',document.getElementById('host-invite-row').classList.contains('hidden'));
        }else{startHint.classList.add('hidden');}
    }
    // Client: detect host disconnect (15s without GAME_STATE)
    if(appState===AppState.PLAYING&&netRole===NetRole.CLIENT){
        if(Date.now()-lastGameStateTime>15000){
            setStatusMsg('Host disconnected',300);
            cleanupClient();
            appState=AppState.MENU;
            showMenu();
            updateControllerUI();
        }
    }
    // Keep controller buttons in sync
    updateControllerUI();
},500);

console.log('Snake 4P Multiplayer loaded! Mobile controls ready.');
