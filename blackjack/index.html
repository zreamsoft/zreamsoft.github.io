// RENDERING
// ============================================================
function renderMenu() { fillRect(0, 0, WIN_W, WIN_H, '#0D0D1A'); }
function renderLobby() { fillRect(0, 0, WIN_W, WIN_H, '#0D0D1A'); }

function drawCardFace(cx, cy, card) {
    const w = CARD_W;
    const h = CARD_H;
    const r = Math.max(2, Math.floor(w * 0.15));
    const rankStr = RANKS[card.rank];
    const suitStr = SUITS[card.suit];
    const color = SUIT_COLORS[card.suit];

    // Subtle card background (semi-transparent white, no shadow, no border)
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    roundRect(ctx, cx, cy, w, h, r);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.12)';
    ctx.lineWidth = 0.5;
    ctx.stroke();

    // Larger centered rank+suit string
    ctx.fillStyle = color;
    const fontSize = Math.max(12, Math.min(
        Math.floor(w * 0.55),
        Math.floor(h * 0.55)
    ));
    ctx.font = 'bold ' + fontSize + 'px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(rankStr + suitStr, cx + w / 2, cy + h / 2);
}

function drawCardBack(cx, cy) {
    const w = CARD_W;
    const h = CARD_H;
    const r = Math.max(2, Math.floor(w * 0.15));

    // Solid back background
    ctx.fillStyle = '#1a3a6e';
    ctx.beginPath();
    roundRect(ctx, cx, cy, w, h, r);
    ctx.fill();

    // Simple inner accent
    const pad = Math.floor(w * 0.15);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    roundRect(ctx, cx + pad, cy + pad, w - pad * 2, h - pad * 2, Math.floor(r * 0.5));
    ctx.fill();

    // Center spade motif
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    const iconSize = Math.floor(h * 0.35);
    ctx.font = iconSize + 'px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('♠', cx + w / 2, cy + h / 2);
}

function drawCard(cx, cy, cardObj, animKey) {
    if (cardObj && cardObj.hidden) {
        drawCardBack(cx, cy);
    } else if (cardObj && cardObj.rank !== undefined) {
        const anim = animKey && _flipAnims[animKey];
        if (anim) {
            const elapsed = performance.now() - anim.start;
            if (elapsed < FLIP_MS) {
                const progress = elapsed / FLIP_MS;
                const scaleX = progress < 0.5 ? 1 - progress * 2 : (progress - 0.5) * 2;
                ctx.save();
                ctx.translate(cx + CARD_W / 2, 0);
                ctx.scale(scaleX, 1);
                ctx.translate(-(cx + CARD_W / 2), 0);
                if (progress < 0.5) {
                    drawCardBack(cx, cy);
                } else {
                    drawCardFace(cx, cy, cardObj);
                }
                ctx.restore();
                return;
            }
            delete _flipAnims[animKey];
        }
        drawCardFace(cx, cy, cardObj);
    }
}

function spawnExplosion(cx, cy) {
    const colors = ['#FFD700','#FF6B6B','#44BBFF','#66DD88','#FFA500','#FF4444','#FFFFFF'];
    for (let i = 0; i < 70; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 5;
        particles.push({
            x: cx, y: cy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1.5,
            size: 2 + Math.random() * 5,
            color: colors[Math.floor(Math.random() * colors.length)],
            life: 1,
            decay: 0.006 + Math.random() * 0.014
        });
    }
}

function spawnCelebration() {
    const colors = ['#FFD700', '#FF6B6B', '#44BBFF', '#66DD88', '#FF69B4', '#00FFFF', '#FFA500'];
    for (let i = 0; i < 50; i++) {
        particles.push({
            x: Math.random() * WIN_W,
            y: -10 - Math.random() * 40,
            vx: (Math.random() - 0.5) * 0.8,
            vy: 0.5 + Math.random() * 1.5,
            size: 2 + Math.random() * 4,
            color: colors[Math.floor(Math.random() * colors.length)],
            life: 1,
            decay: 0.004 + Math.random() * 0.004
        });
    }
}

function spawnSadEffect(cx, cy) {
    const colors = ['#555555', '#777777', '#444444', '#666666', '#888888', '#333333'];
    for (let i = 0; i < 60; i++) {
        const angle = Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 0.6;
        const speed = 1 + Math.random() * 3;
        particles.push({
            x: cx + (Math.random() - 0.5) * 40,
            y: cy + (Math.random() - 0.5) * 40,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: 2 + Math.random() * 4,
            color: colors[Math.floor(Math.random() * colors.length)],
            life: 1,
            decay: 0.008 + Math.random() * 0.012
        });
    }
}

function checkGameEffects() {
    if (gameState.phase !== Phase.ROUND_OVER) return;
    if (gameState.round === _lastEffectRound) return;

    const sectionH = Math.floor(WIN_H / 5);
    const p = gameState.players[localPlayerId];
    if (!p) return;

    const y = (localPlayerId + 1) * sectionH + sectionH / 2;

    if (p.result === 'win' || p.result === 'blackjack') {
        spawnCelebration();
        _lastEffectRound = gameState.round;
    } else if (p.result === 'lose' || p.busted) {
        spawnSadEffect(WIN_W / 2, y);
        _lastEffectRound = gameState.round;
    }
    // push: no effect
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.06;
        p.vx *= 0.98;
        p.life -= p.decay;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
}

function renderBJGame() {
    const sectionH = Math.floor(WIN_H / 5);
    CARD_H = Math.max(18, Math.min(Math.floor(sectionH * 0.33), 40));
    CARD_W = CARD_H;

    // Detect new cards and start flip animations
    const _now = performance.now();
    function _checkHand(key, hand) {
        const prev = _prevCardCounts[key] || 0;
        for (let i = prev; i < hand.length; i++) {
            _flipAnims[key + '-c' + i] = { start: _now };
        }
        _prevCardCounts[key] = hand.length;
    }
    _checkHand('dealer', gameState.dealer.hand || []);
    for (let pIdx = 0; pIdx < MAX_PLAYERS; pIdx++) {
        const p = gameState.players[pIdx];
        for (let hi = 0; hi < (p.hands ? p.hands.length : 0); hi++) {
            _checkHand('p' + pIdx + 'h' + hi, p.hands[hi]);
        }
    }
    for (const k in _flipAnims) {
        if (_now - _flipAnims[k].start >= FLIP_MS) delete _flipAnims[k];
    }

    // Green felt background
    fillRect(0, 0, WIN_W, WIN_H, '#0e4a1e');

    // Radial gradient for grass-table depth (lighter center, darker edges)
    const grad = ctx.createRadialGradient(WIN_W/2, WIN_H/2, 0, WIN_W/2, WIN_H/2, WIN_W*0.7);
    grad.addColorStop(0, 'rgba(50,160,70,0.15)');
    grad.addColorStop(1, 'rgba(0,0,0,0.2)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, WIN_W, WIN_H);

    // Section dividers
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    for (let s = 1; s < 5; s++) {
        const y = s * sectionH;
        ctx.beginPath();
        ctx.moveTo(10, y);
        ctx.lineTo(WIN_W - 10, y);
        ctx.stroke();
    }

    const playerColors = ['#FFD700', '#44BBFF', '#FF6B6B', '#66DD88'];
    const playerBgActive = [
        'rgba(255,215,0,0.25)',   // P1 gold
        'rgba(68,187,255,0.25)',  // P2 blue
        'rgba(255,107,107,0.25)', // P3 red
        'rgba(102,221,136,0.25)'  // P4 green
    ];
    const cardGap = Math.floor(CARD_W * 0.15);

    // ---- DEALER SECTION (index 0) ----
    const dealerLabelY = Math.floor(sectionH * 0.08);
    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold ' + Math.max(13, Math.floor(CARD_H * 0.50)) + 'px monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText('DEALER', 10, dealerLabelY);

    const dealerCards = gameState.dealer.hand || [];
    const dealerTotalWidth = dealerCards.length * CARD_W + (dealerCards.length - 1) * cardGap;
    let dealerCX = (WIN_W - dealerTotalWidth) / 2;
    const dealerCardY = Math.floor(sectionH * 0.32);

    for (let ci = 0; ci < dealerCards.length; ci++) {
        drawCard(dealerCX, dealerCardY, dealerCards[ci], 'dealer-c' + ci);
        dealerCX += CARD_W + cardGap;
    }

    // Dealer total
    const showTotal = dealerCards.length > 0 && (gameState.phase === Phase.DEALER_TURN || gameState.phase === Phase.ROUND_OVER || gameState.dealer.hidden === false);
    if (dealerCards.length > 0) {
        if (showTotal) {
            const dVal = handValue(dealerCards);
            ctx.font = 'bold ' + Math.max(13, Math.floor(CARD_H * 0.50)) + 'px monospace';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            const totalStr = dVal > 21 ? 'BUST' : (isBlackjack(dealerCards) ? '21 - BLACKJACK' : String(dVal));
            if (isBlackjack(dealerCards)) {
                const hue = (performance.now() * 0.12) % 360;
                ctx.shadowColor = 'hsl(' + hue + ', 100%, 60%)';
                ctx.shadowBlur = 14;
            }
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText(totalStr, 10, dealerCardY + CARD_H + 8);
            ctx.shadowBlur = 0;
        } else {
            let visibleVal = 0;
            for (const c of dealerCards) {
                if (!c.hidden && c.rank !== undefined) visibleVal += cardValue(c.rank);
            }
            ctx.fillStyle = '#AAAAAA';
            ctx.font = Math.max(13, Math.floor(CARD_H * 0.50)) + 'px monospace';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText('Showing: ' + (visibleVal > 0 ? String(visibleVal) : '?'), 10, dealerCardY + CARD_H + 8);
        }
    }

    // Dealer blackjack explosion
    if (isBlackjack(dealerCards) && showTotal && !_dealerBJShown) {
        _dealerBJShown = true;
        spawnExplosion(WIN_W / 2, dealerCardY);
    }
    if (!isBlackjack(dealerCards) || !showTotal) {
        _dealerBJShown = false;
    }

    // ---- PLAYER SECTIONS (indices 0-3, each at section 1-4) ----
    for (let pIdx = 0; pIdx < MAX_PLAYERS; pIdx++) {
        const y = (pIdx + 1) * sectionH;
        const p = gameState.players[pIdx];
        const isActive = p.active;
        const isCurrent = (pIdx === gameState.currentPlayer && gameState.phase === Phase.PLAYING);
        const color = playerColors[pIdx];

        // Player area background tint
        if (gameState.phase === Phase.ROUND_OVER && isActive) {
            if (p.result === 'win' || p.result === 'blackjack') {
                ctx.fillStyle = 'rgba(60,220,60,0.30)';
            } else if (p.result === 'push') {
                ctx.fillStyle = 'rgba(200,200,200,0.25)';
            } else if (p.result === 'lose') {
                ctx.fillStyle = 'rgba(240,60,60,0.30)';
            } else {
                ctx.fillStyle = 'rgba(255,255,255,0.04)';
            }
        } else if (isCurrent) {
            ctx.fillStyle = playerBgActive[pIdx];
        } else {
            ctx.fillStyle = isActive ? 'rgba(255,255,255,0.04)' : 'rgba(255,255,255,0.015)';
        }
        ctx.beginPath();
        roundRect(ctx, 6, y + 4, WIN_W - 12, sectionH - 8, 4);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Player name
        const nameY = y + Math.floor(sectionH * 0.10);
        ctx.fillStyle = isCurrent ? color : (isActive ? color : '#555555');
        ctx.font = 'bold ' + Math.max(13, Math.floor(CARD_H * 0.50)) + 'px monospace';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        let nameStr = 'P' + (pIdx + 1) + (pIdx === localPlayerId ? ' (You)' : '');
        if (!isActive) nameStr += ' (Empty)';
        ctx.fillText(nameStr, 16, nameY);

        if (isActive) {
            // Chip count
            const chipsY = y + Math.floor(sectionH * 0.26);
            ctx.fillStyle = '#CCCCCC';
            ctx.font = Math.max(11, Math.floor(CARD_H * 0.40)) + 'px monospace';
            ctx.fillText('$' + p.chips + '  Bet: $' + p.bet, 16, chipsY);

            // Cards — fixed position, value text below with padding
            const valFont = Math.max(13, Math.floor(CARD_H * 0.50));
            const cardY = y + Math.floor(sectionH * 0.44);

            for (let hi = 0; hi < (p.hands ? p.hands.length : 0); hi++) {
                const hand = p.hands[hi];
                let cardX = 16 + hi * (CARD_W + cardGap) * 0.3;
                for (let ci = 0; ci < hand.length; ci++) {
                    drawCard(cardX, cardY, hand[ci], 'p' + pIdx + 'h' + hi + '-c' + ci);
                    cardX += CARD_W + cardGap;
                }
            }

            // Hand value — dedicated space at bottom of section
            if (p.hands && p.hands[0] && p.hands[0].length > 0) {
                const val = handValue(p.hands[0]);
                let valStr = '';
                if (p.busted) valStr = 'BUST';
                else if (p.result === 'blackjack') valStr = 'BLACKJACK!';
                else valStr = String(val);
                ctx.fillStyle = p.busted ? '#FF4444' : (p.result === 'blackjack' ? '#FFD700' : '#FFFFFF');
                ctx.font = 'bold ' + valFont + 'px monospace';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.fillText(valStr, 16, Math.min(cardY + CARD_H + 12, y + sectionH - valFont - 3));
            }
        }

    }
}

let _prevState = -1;
function renderDispatch() {
    if (appState !== _prevState) {
        resizeGame();
        _prevState = appState;
    }
    ctx.clearRect(0, 0, WIN_W, WIN_H);
    switch (appState) {
        case AppState.MENU:
            renderMenu();
            break;
        case AppState.LOBBY:
            renderLobby();
            break;
        case AppState.PLAYING:
            renderBJGame();
            updateParticles();
            updateInfoBar();
            updateGameOverOverlay();
            break;
    }
}

// ============================================================
// INPUT: KEYBOARD
// ============================================================
document.addEventListener('keydown', (e) => {
    if (e.repeat) return;

    if (appState === AppState.MENU) {
        switch (e.key) {
            case '1':
                if (!document.getElementById('menu-overlay').classList.contains('hidden')) createGame();
                break;
            case '2':
                if (!document.getElementById('menu-overlay').classList.contains('hidden')) showJoinUI();
                break;
            case 'x':
            case 'X':
            case 'Escape':
                window.close();
                break;
        }
        return;
    }

    if (appState === AppState.LOBBY) {
        if (e.key === ' ' || e.key === 'Space') { e.preventDefault();
            onActionStart(); }
        if (e.key === 'x' || e.key === 'X' || e.key === 'Escape') { onActionQuit(); }
        return;
    }

    if (appState === AppState.PLAYING) {
        if (e.key === 'x' || e.key === 'X' || e.key === 'Escape') { onActionQuit(); return; }
        if (e.key === ' ' || e.key === 'Space') {
            if (netRole === NetRole.HOST && (gameState.phase === Phase.ROUND_OVER || gameState.phase === Phase.BETTING)) {
                e.preventDefault();
                onActionStart();
                return;
            }
        }
        // Only accept action keys when it's my turn
        if (gameState.currentPlayer === localPlayerId && gameState.phase === Phase.PLAYING) {
            const p = gameState.players[localPlayerId];
            if (!p || p.standing || p.busted) return;
            switch (e.key) {
                case 'h':
                case 'H':
                    handleLocalAction(Action.HIT);
                    break;
                case 's':
                case 'S':
                    handleLocalAction(Action.STAND);
                    break;
                case 'd':
                case 'D':
                    if (p.hands[0].length <= 2 && p.chips >= p.bet)
                        handleLocalAction(Action.DOUBLE_DOWN);
                    break;
            }
        }
    }
});

// ============================================================
// INPUT: LOCAL ACTION HANDLER
// ============================================================
function handleLocalAction(action) {
    if (appState !== AppState.PLAYING) return;
    if (gameState.currentPlayer !== localPlayerId) return;
    if (gameState.phase !== Phase.PLAYING) return;

    if (netRole === NetRole.HOST) {
        handleAction(localPlayerId, action);
    } else if (netRole === NetRole.CLIENT && clientConnection && clientConnection.open) {
        const buf = new ArrayBuffer(2);
        const v = new Uint8Array(buf);
        v[0] = PacketType.PLAYER_ACTION;
        v[1] = action;
        clientConnection.send(buf);
    }
}

// ============================================================
// TOUCH: Action Buttons
// ============================================================
document.getElementById('btn-hit').addEventListener('click', () => handleLocalAction(Action.HIT));
document.getElementById('btn-hit').addEventListener('touchend', (e) => { e.preventDefault();
    handleLocalAction(Action.HIT); });
document.getElementById('btn-stand').addEventListener('click', () => handleLocalAction(Action.STAND));
document.getElementById('btn-stand').addEventListener('touchend', (e) => { e.preventDefault();
    handleLocalAction(Action.STAND); });
document.getElementById('btn-double').addEventListener('click', () => handleLocalAction(Action.DOUBLE_DOWN));
document.getElementById('btn-double').addEventListener('touchend', (e) => { e.preventDefault();
    handleLocalAction(Action.DOUBLE_DOWN); });

// ============================================================
// ACTION BUTTON WIRING
// ============================================================
document.getElementById('btn-start-game').addEventListener('click', onActionStart);
document.getElementById('btn-start-game').addEventListener('touchend', (e) => { e.preventDefault();
    onActionStart(); });
document.getElementById('btn-quit-game').addEventListener('click', onActionQuit);
document.getElementById('btn-quit-game').addEventListener('touchend', (e) => { e.preventDefault();
    onActionQuit(); });

document.getElementById('btn-lobby-start').addEventListener('click', onActionStart);
document.getElementById('btn-lobby-start').addEventListener('touchend', (e) => { e.preventDefault();
    onActionStart(); });
document.getElementById('btn-lobby-cancel').addEventListener('click', onActionQuit);
document.getElementById('btn-lobby-cancel').addEventListener('touchend', (e) => { e.preventDefault();
    onActionQuit(); });

// ============================================================
// RESIZE HANDLER
// ============================================================
window.addEventListener('resize', () => {
    resizeGame();
    renderDispatch();
});

// ============================================================
// BROWSER CLOSE DETECTION
// ============================================================
window.addEventListener('beforeunload', () => {
    if (netRole === NetRole.CLIENT && clientConnection && clientConnection.open) {
        try {
            const buf = new ArrayBuffer(1);
            const v = new Uint8Array(buf);
            v[0] = PacketType.PLAYER_LEAVE;
            clientConnection.send(buf);
        } catch (e) { }
    } else if (netRole === NetRole.HOST) {
        const buf = new ArrayBuffer(1);
        const v = new Uint8Array(buf);
        v[0] = PacketType.PLAYER_LEAVE;
        for (let i = 1; i < MAX_PLAYERS; i++) {
            if (hostConnections[i] && hostConnections[i].open) {
                try { hostConnections[i].send(buf); } catch (e) { }
            }
        }
    }
});

// ============================================================
// GAME LOOP
// ============================================================
let lastFrameTime = performance.now();

function gameLoop(timestamp) {
    const dt = timestamp - lastFrameTime;
    if (dt >= (1000 / 60)) {
        renderDispatch();
        lastFrameTime = timestamp;
    }
    requestAnimationFrame(gameLoop);
}

// ============================================================
// INIT
// ============================================================
function init() {
    for (let i = 0; i < MAX_PLAYERS; i++) {
        gameState.players[i] = {
            active: false,
            hands: [[]],
            bet: DEFAULT_BET,
            chips: DEFAULT_CHIPS,
            standing: false,
            busted: false,
            result: 'pending'
        };
    }
    gameState.dealer = { hand: [], hidden: true };
    gameState.phase = Phase.BETTING;
    gameState.currentPlayer = -1;
    gameState.round = 0;
    gameState.turnOrder = [];
    gameState.message = 'Press DEAL to start a round!';
    appState = AppState.MENU;
    _lastEffectRound = -1;
    netRole = NetRole.NONE;
    localPlayerId = -1;
    activePlayerCount = 0;
    playerConnectionType = new Array(MAX_PLAYERS).fill('');
    lastAckTick = new Array(MAX_PLAYERS).fill(-1);
    tickCounter = 0;
    lastGameStateTime = Date.now();
    playerDisconnected = new Array(MAX_PLAYERS).fill(false);
    hostConnections = new Array(MAX_PLAYERS).fill(null);
    deck = [];
    resizeGame();
    showMenu();
    requestAnimationFrame(gameLoop);
}
init();
checkAutoJoin();

// Lobby UI polling
setInterval(() => {
    if (appState === AppState.LOBBY) {
        const startHint = document.getElementById('start-hint');
        if (netRole === NetRole.HOST && activePlayerCount >= 1) {
            startHint.classList.remove('hidden');
        } else { startHint.classList.add('hidden'); }
    }
    // Host heartbeat (every ~5s = 10 intervals)
    if (appState !== AppState.MENU && netRole === NetRole.HOST) {
        tickCounter++;
        if (tickCounter % 10 === 0) {
            for (let i = 1; i < MAX_PLAYERS; i++) {
                if (hostConnections[i] && gameState.players[i].active)
                    sendPkt(hostConnections[i], PacketType.HEARTBEAT, null);
            }
        }
        if (tickCounter % 2 === 0) {
            for (let i = 1; i < MAX_PLAYERS; i++) {
                if (hostConnections[i] && lastAckTick[i] >= 0 && tickCounter - lastAckTick[i] > 20)
                    handlePlayerDisconnect(i);
            }
        }
    }
    // Client: detect host disconnect (30s without any packet)
    if (appState !== AppState.MENU && netRole === NetRole.CLIENT) {
        if (Date.now() - lastGameStateTime > 30000) {
            setStatusMsg('Host disconnected', 300);
            cleanupClient();
            appState = AppState.MENU;
            showMenu();
            updateControllerUI();
        }
    }
    updateControllerUI();
}, 500);

console.log('Blackjack 4P Multiplayer loaded!');
</script>
